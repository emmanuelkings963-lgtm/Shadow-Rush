<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Shadow Rush</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050510;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

#gameCanvas {
  display: block;
  margin: auto;
  background: #101020;
  width: 100vw;
  max-width: 500px;
  height: 100vh;
}

#hud {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: min(94vw, 470px);
  z-index: 5;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.hudBox {
  background: rgba(0,0,0,.7);
  border: 2px solid #00eaff;
  border-radius: 10px;
  padding: 7px 10px;
  text-shadow: 0 0 8px #00eaff;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #050510;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
}

.menuBox,
.gameOverBox {
  width: 92%;
  max-width: 420px;
  padding: 25px;
  border: 2px solid #00eaff;
  border-radius: 20px;
  background: #09091a;
  box-shadow: 0 0 30px #0066ff;
}

h1 {
  color: #00eaff;
  text-shadow: 0 0 18px #00aaff;
}

button {
  padding: 13px 20px;
  margin: 7px;
  border: 2px solid #00aaff;
  border-radius: 10px;
  background: #080820;
  color: #00eaff;
  font-weight: bold;
  font-size: 15px;
}

button:active {
  transform: scale(.95);
}

.option {
  background: #11112a;
  border: 1px solid #333366;
  border-radius: 12px;
  padding: 10px;
  margin: 8px 0;
}

.selected {
  border-color: #00eaff;
  box-shadow: 0 0 12px #0066ff;
}

.hidden {
  display: none !important;
}

#controls {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  width: min(95vw, 450px);
  display: flex;
  justify-content: space-between;
}

.controlButton {
  width: 70px;
  height: 55px;
  font-size: 22px;
  background: rgba(0,0,0,.65);
}

#gameOver {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0,0,0,.9);
  display: flex;
  align-items: center;
  justify-content: center;
}

.gameOverBox {
  border-color: #ff3355;
}

.smallText {
  color: #aaa;
  font-size: 13px;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">

  <div class="hudBox">
    🪙 <span id="coinsText">0</span>
  </div>

  <div class="hudBox">
    🏆 <span id="scoreText">0</span>
  </div>

  <div class="hudBox">
    ⚡ <span id="speedText">1.0</span>
  </div>

</div>


<!-- MENU -->
<div id="menu">

  <div class="menuBox">

    <h1>🏃 SHADOW RUSH</h1>

    <p>⚔️ THE ENDLESS RUN BEGINS</p>

    <p>
      🪙 Coins:
      <strong id="menuCoins">0</strong>
    </p>

    <p>
      🏆 Best Score:
      <strong id="bestScore">0</strong>
    </p>

    <div class="option">

      <strong>🧑 CHARACTER</strong>

      <br>

      <button
        id="rookieButton"
        onclick="chooseCharacter('rookie')">
        Rookie
      </button>

      <button
        id="blazeButton"
        onclick="chooseCharacter('blaze')">
        Blaze
      </button>

      <button
        id="shadowButton"
        onclick="chooseCharacter('shadow')">
        Shadow
      </button>

    </div>


    <div class="option">

      <strong>🛼 SKATES</strong>

      <br>

      <button
        id="basicSkatesButton"
        onclick="chooseSkates('basic')">
        Basic
      </button>

      <button
        id="speedSkatesButton"
        onclick="chooseSkates('speed')">
        Speed
      </button>

      <button
        id="shadowSkatesButton"
        onclick="chooseSkates('shadow')">
        Shadow
      </button>

    </div>


    <p id="selectionText">
      🧑 Rookie + 🛼 Basic
    </p>


    <button onclick="startGame()">
      ▶️ START RUN
    </button>


    <button onclick="resetSave()">
      🗑️ RESET SAVE
    </button>


    <p class="smallText">
      Swipe or use the buttons to move.
    </p>

  </div>

</div>


<!-- CONTROLS -->
<div id="controls" class="hidden">

  <button
    class="controlButton"
    onclick="moveLeft()">
    ◀
  </button>

  <button
    class="controlButton"
    onclick="jump()">
    ⬆
  </button>

  <button
    class="controlButton"
    onclick="moveRight()">
    ▶
  </button>

</div>


<!-- GAME OVER -->
<div id="gameOver" class="hidden">

  <div class="gameOverBox">

    <h1>💀 RUN OVER</h1>

    <h2>
      🏆 Score:
      <span id="finalScore">0</span>
    </h2>

    <p>
      🪙 Coins:
      <span id="finalCoins">0</span>
    </p>

    <p>
      🏆 Best:
      <span id="finalBest">0</span>
    </p>

    <button onclick="startGame()">
      🔄 RUN AGAIN
    </button>

    <button onclick="returnToMenu()">
      🏠 MENU
    </button>

  </div>

</div>


<script>

/* =====================================================
   SHADOW RUSH
   PERMANENT SAVE
===================================================== */

const SAVE_KEY =
  "shadowRushPermanentSave_v1";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");


function resizeCanvas() {

  canvas.width =
    Math.min(
      window.innerWidth,
      500
    );

  canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   GAME SAVE
===================================================== */

let saveData = {

  coins: 0,

  bestScore: 0,

  selectedCharacter: "rookie",

  selectedSkates: "basic",

  unlockedCharacters: [
    "rookie"
  ],

  unlockedSkates: [
    "basic"
  ]

};


function saveGame() {

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(saveData)
  );

}


function loadGame() {

  const saved =
    localStorage.getItem(
      SAVE_KEY
    );

  if (!saved) {
    return;
  }

  try {

    saveData = {
      ...saveData,
      ...JSON.parse(saved)
    };

  } catch(error) {

    console.log(
      "Save loading failed."
    );

  }

}


function resetSave() {

  const confirmReset =
    confirm(
      "Reset all Shadow Rush progress?"
    );

  if (!confirmReset) {
    return;
  }

  localStorage.removeItem(
    SAVE_KEY
  );

  location.reload();

}


/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;

let animationID = null;

let score = 0;

let runCoins = 0;

let speed = 1;

let distance = 0;

let spawnTimer = 0;

let coinTimer = 0;

let obstacles = [];

let coins = [];

let player = {

  lane: 1,

  x: 0,

  y: 0,

  width: 42,

  height: 62,

  jumping: false,

  jumpVelocity: 0,

  jumpY: 0

};


/* =====================================================
   CHARACTER DATA
===================================================== */

const characters = {

  rookie: {

    name: "Rookie",

    emoji: "🧑",

    color: "#00eaff",

    speedBonus: 0

  },

  blaze: {

    name: "Blaze",

    emoji: "🔥",

    color: "#ff6633",

    speedBonus: 0.15

  },

  shadow: {

    name: "Shadow",

    emoji: "👤",

    color: "#aa55ff",

    speedBonus: 0.30

  }

};


/* =====================================================
   SKATE DATA
===================================================== */

const skates = {

  basic: {

    name: "Basic",

    emoji: "🛼",

    speedBonus: 0

  },

  speed: {

    name: "Speed",

    emoji: "⚡",

    speedBonus: 0.20

  },

  shadow: {

    name: "Shadow",

    emoji: "🌑",

    speedBonus: 0.40

  }

};


/* =====================================================
   LOAD
===================================================== */

loadGame();


/* =====================================================
   CHARACTER SELECTION
===================================================== */

function chooseCharacter(name) {

  if (
    !saveData.unlockedCharacters
      .includes(name)
  ) {

    alert(
      "🔒 Character locked!"
    );

    return;

  }

  saveData.selectedCharacter =
    name;

  saveGame();

  updateMenu();

}


/* =====================================================
   SKATE SELECTION
===================================================== */

function chooseSkates(name) {

  if (
    !saveData.unlockedSkates
      .includes(name)
  ) {

    alert(
      "🔒 Skates locked!"
    );

    return;

  }

  saveData.selectedSkates =
    name;

  saveGame();

  updateMenu();

}


/* =====================================================
   MENU
===================================================== */

function updateMenu() {

  document.getElementById(
    "menuCoins"
  ).innerText =
    saveData.coins;

  document.getElementById(
    "bestScore"
  ).innerText =
    Math.floor(
      saveData.bestScore
    );


  const character =
    characters[
      saveData.selectedCharacter
    ];

  const skate =
    skates[
      saveData.selectedSkates
    ];


  document.getElementById(
    "selectionText"
  ).innerText =

    "🧑 " +
    character.name +

    " + " +

    skate.emoji +
    " " +
    skate.name;


  document
    .getElementById(
      "rookieButton"
    )
    .classList.toggle(
      "selected",
      saveData.selectedCharacter ===
      "rookie"
    );


  document
    .getElementById(
      "blazeButton"
    )
    .classList.toggle(
      "selected",
      saveData.selectedCharacter ===
      "blaze"
    );


  document
    .getElementById(
      "shadowButton"
    )
    .classList.toggle(
      "selected",
      saveData.selectedCharacter ===
      "shadow"
    );


  document
    .getElementById(
      "basicSkatesButton"
    )
    .classList.toggle(
      "selected",
      saveData.selectedSkates ===
      "basic"
    );


  document
    .getElementById(
      "speedSkatesButton"
    )
    .classList.toggle(
      "selected",
      saveData.selectedSkates ===
      "speed"
    );


  document
    .getElementById(
      "shadowSkatesButton"
    )
    .classList.toggle(
      "selected",
      saveData.selectedSkates ===
      "shadow"
    );

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

  document
    .getElementById(
      "menu"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "gameOver"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "controls"
    )
    .classList.remove(
      "hidden"
    );


  score = 0;

  runCoins = 0;

  distance = 0;

  spawnTimer = 0;

  coinTimer = 0;

  obstacles = [];

  coins = [];

  speed = 1;


  player.lane = 1;

  player.jumping = false;

  player.jumpVelocity = 0;

  player.jumpY = 0;


  running = true;


  updateHUD();


  if (animationID) {

    cancelAnimationFrame(
      animationID
    );

  }


  gameLoop();

}


/* =====================================================
   RETURN MENU
===================================================== */

function returnToMenu() {

  running = false;

  document
    .getElementById(
      "gameOver"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "controls"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "menu"
    )
    .classList.remove(
      "hidden"
    );


  updateMenu();

}


/* =====================================================
   LANE POSITION
===================================================== */

function getLaneX(lane) {

  const center =
    canvas.width / 2;

  const spacing =
    Math.min(
      canvas.width * 0.25,
      110
    );


  return (
    center +
    (lane - 1) *
    spacing
  );

}


/* =====================================================
   MOVE LEFT
===================================================== */

function moveLeft() {

  if (!running) {
    return;
  }

  if (
    player.lane > 0
  ) {

    player.lane--;

  }

}


/* =====================================================
   MOVE RIGHT
===================================================== */

function moveRight() {

  if (!running) {
    return;
  }

  if (
    player.lane < 2
  ) {

    player.lane++;

  }

}


/* =====================================================
   JUMP
===================================================== */

function jump() {

  if (!running) {
    return;
  }

  if (
    player.jumping
  ) {
    return;
  }

  player.jumping =
    true;

  player.jumpVelocity =
    15;

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "ArrowLeft"
    ) {

      moveLeft();

    }

    else if (
      event.key === "ArrowRight"
    ) {

      moveRight();

    }

    else if (
      event.key === "ArrowUp" ||
      event.key === " "
    ) {

      jump();

    }

  }
);


/* =====================================================
   TOUCH SWIPE
===================================================== */

let touchStartX = 0;

let touchStartY = 0;


document.addEventListener(
  "touchstart",
  function(event) {

    const touch =
      event.changedTouches[0];

    touchStartX =
      touch.screenX;

    touchStartY =
      touch.screenY;

  },
  {passive: true}
);


document.addEventListener(
  "touchend",
  function(event) {

    if (!running) {
      return;
    }

    const touch =
      event.changedTouches[0];

    const dx =
      touch.screenX -
      touchStartX;

    const dy =
      touch.screenY -
      touchStartY;


    if (
      Math.abs(dx) >
      Math.abs(dy)
    ) {

      if (
        Math.abs(dx) > 30
      ) {

        if (dx > 0) {

          moveRight();

        } else {

          moveLeft();

        }

      }

    } else {

      if (
        dy < -30
      ) {

        jump();

      }

    }

  },
  {passive: true}
);


/* =====================================================
   SPAWN OBSTACLE
===================================================== */

function spawnObstacle() {

  const lane =
    Math.floor(
      Math.random() * 3
    );


  obstacles.push({

    lane: lane,

    y: -80,

    width: 55,

    height: 55,

    type:
      Math.random() < 0.5
      ? "barrier"
      : "monster"

  });

}


/* =====================================================
   SPAWN COIN
===================================================== */

function spawnCoin() {

  const lane =
    Math.floor(
      Math.random() * 3
    );


  coins.push({

    lane: lane,

    y: -30,

    radius: 13

  });

}


/* =====================================================
   UPDATE PLAYER
===================================================== */

function updatePlayer() {

  if (
    player.jumping
  ) {

    player.jumpY +=
      player.jumpVelocity;

    player.jumpVelocity -=
      0.8;


    if (
      player.jumpY <= 0
    ) {

      player.jumpY = 0;

      player.jumping =
        false;

      player.jumpVelocity =
        0;

    }

  }

}


/* =====================================================
   UPDATE OBSTACLES
===================================================== */

function updateObstacles() {

  for (
    let i = obstacles.length - 1;
    i >= 0;
    i--
  ) {

    const obstacle =
      obstacles[i];


    obstacle.y +=
      7 * speed;


    if (
      checkObstacleCollision(
        obstacle
      )
    ) {

      endGame();

      return;

    }


    if (
      obstacle.y >
      canvas.height + 100
    ) {

      obstacles.splice(
        i,
        1
      );

    }

  }

}


/* =====================================================
   UPDATE COINS
===================================================== */

function updateCoins() {

  for (
    let i = coins.length - 1;
    i >= 0;
    i--
  ) {

    const coin =
      coins[i];


    coin.y +=
      7 * speed;


    if (
      checkCoinCollision(
        coin
      )
    ) {

      runCoins++;

      coins.splice(
        i,
        1
      );

      continue;

    }


    if (
      coin.y >
      canvas.height + 50
    ) {

      coins.splice(
        i,
        1
      );

    }

  }

}


/* =====================================================
   OBSTACLE COLLISION
===================================================== */

function checkObstacleCollision(
  obstacle
) {

  const playerX =
    getLaneX(
      player.lane
    );


  const playerY =
    canvas.height - 150 -
    player.jumpY;


  const obstacleX =
    getLaneX(
      obstacle.lane
    );


  const verticalDistance =
    Math.abs(
      obstacle.y -
      playerY
    );


  const horizontalDistance =
    Math.abs(
      obstacleX -
      playerX
    );


  /*
    Jumping high enough
    allows the player to
    clear the obstacle.
  */

  if (
    player.jumpY > 55
  ) {

    return false;

  }


  return (
    horizontalDistance <
      45 &&

    verticalDistance <
      55
  );

}


/* =====================================================
   COIN COLLISION
===================================================== */

function checkCoinCollision(
  coin
) {

  const playerX =
    getLaneX(
      player.lane
    );


  const playerY =
    canvas.height - 150 -
    player.jumpY;


  const coinX =
    getLaneX(
      coin.lane
    );


  const distanceX =
    Math.abs(
      coinX -
      playerX
    );


  const distanceY =
    Math.abs(
      coin.y -
      playerY
    );


  return (
    distanceX < 45 &&
    distanceY < 55
  );

}


/* =====================================================
   DRAW ROAD
===================================================== */

function drawRoad() {

  const w =
    canvas.width;

  const h =
    canvas.height;


  ctx.fillStyle =
    "#090914";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
    Road
  */

  const roadWidth =
    Math.min(
      w * 0.85,
      430
    );


  const roadLeft =
    (w - roadWidth) / 2;


  ctx.fillStyle =
    "#171725";

  ctx.fillRect(
    roadLeft,
    0,
    roadWidth,
    h
  );


  /*
    Road edges
  */

  ctx.strokeStyle =
    "#00aaff";

  ctx.lineWidth =
    4;

  ctx.beginPath();

  ctx.moveTo(
    roadLeft,
    0
  );

  ctx.lineTo(
    roadLeft,
    h
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    roadLeft + roadWidth,
    0
  );

  ctx.lineTo(
    roadLeft + roadWidth,
    h
  );

  ctx.stroke();


  /*
    Lane lines
  */

  const spacing =
    roadWidth / 3;


  ctx.strokeStyle =
    "#555577";

  ctx.lineWidth =
    3;


  for (
    let i = 1;
    i < 3;
    i++
  ) {

    const x =
      roadLeft +
      spacing * i;


    const offset =
      (distance % 70);


    for (
      let y = -70 + offset;
      y < h;
      y += 70
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        x,
        y + 35
      );

      ctx.stroke();

    }

  }


  /*
    Background buildings
  */

  ctx.fillStyle =
    "#08080f";


  for (
    let i = 0;
    i < 8;
    i++
  ) {

    const buildingWidth =
      35 + (i % 3) * 15;


    const buildingHeight =
      100 + (i % 4) * 40;


    const x =
      i % 2 === 0
      ? i * 35
      : w - i * 35 - buildingWidth;


    ctx.fillRect(
      x,
      h - buildingHeight,
      buildingWidth,
      buildingHeight
    );

  }

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer() {

  const character =
    characters[
      saveData.selectedCharacter
    ];


  const x =
    getLaneX(
      player.lane
    );


  const y =
    canvas.height -
    150 -
    player.jumpY;


  /*
    Shadow underneath
  */

  ctx.beginPath();

  ctx.ellipse(
    x,
    canvas.height - 83,
    25,
    8,
    0,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "rgba(0,0,0,.5)";

  ctx.fill();


  /*
    Glow
  */

  ctx.shadowBlur =
    20;

  ctx.shadowColor =
    character.color;


  ctx.font =
    "48px Arial";

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    character.color;


  ctx.fillText(
    character.emoji,
    x,
    y + 50
  );


  ctx.shadowBlur =
    0;


  /*
    Skates
  */

  const skate =
    skates[
      saveData.selectedSkates
    ];


  ctx.font =
    "22px Arial";

  ctx.fillText(
    skate.emoji,
    x,
    y + 75
  );

}


/* =====================================================
   DRAW OBSTACLES
===================================================== */

function drawObstacles() {

  obstacles.forEach(
    obstacle => {

      const x =
        getLaneX(
          obstacle.lane
        );


      ctx.textAlign =
        "center";


      ctx.shadowBlur =
        15;

      ctx.shadowColor =
        "#ff3355";


      ctx.font =
        "45px Arial";


      if (
        obstacle.type ===
        "barrier"
      ) {

        ctx.fillText(
          "🚧",
          x,
          obstacle.y
        );

      } else {

        ctx.fillText(
          "👹",
          x,
          obstacle.y
        );

      }


      ctx.shadowBlur =
        0;

    }
  );

}


/* =====================================================
   DRAW COINS
===================================================== */

function drawCoins() {

  coins.forEach(
    coin => {

      const x =
        getLaneX(
          coin.lane
        );


      ctx.beginPath();

      ctx.arc(
        x,
        coin.y,
        coin.radius,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        "#ffd700";


      ctx.shadowBlur =
        15;

      ctx.shadowColor =
        "#ffd700";


      ctx.fill();


      ctx.shadowBlur =
        0;


      ctx.font =
        "14px Arial";

      ctx.fillStyle =
        "#111";

      ctx.textAlign =
        "center";

      ctx.fillText(
        "$",
        x,
        coin.y + 5
      );

    }
  );

}


/* =====================================================
   DRAW
===================================================== */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  drawRoad();

  drawCoins();

  drawObstacles();

  drawPlayer();

}


/* =====================================================
   UPDATE GAME
===================================================== */

function updateGame() {

  if (!running) {
    return;
  }


  distance +=
    speed;


  /*
    Score increases with distance.
  */

  score +=
    0.15 * speed;


  /*
    Speed gradually increases.
  */

  speed =
    1 +
    Math.min(
      4,
      score / 1000
    );


  const character =
    characters[
      saveData.selectedCharacter
    ];


  const skate =
    skates[
      saveData.selectedSkates
    ];


  speed +=
    character.speedBonus;


  speed +=
    skate.speedBonus;


  /*
    Spawn obstacles.
  */

  spawnTimer +=
    speed;


  if (
    spawnTimer >
    75
  ) {

    spawnObstacle();

    spawnTimer = 0;

  }


  /*
    Spawn coins.
  */

  coinTimer +=
    speed;


  if (
    coinTimer >
    45
  ) {

    spawnCoin();

    coinTimer = 0;

  }


  updatePlayer();

  updateObstacles();

  updateCoins();

  updateHUD();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

  document.getElementById(
    "coinsText"
  ).innerText =
    runCoins;


  document.getElementById(
    "scoreText"
  ).innerText =
    Math.floor(
      score
    );


  document.getElementById(
    "speedText"
  ).innerText =
    speed.toFixed(1);

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

  if (!running) {
    return;
  }


  updateGame();

  draw();


  animationID =
    requestAnimationFrame(
      gameLoop
    );

}


/* =====================================================
   END GAME
===================================================== */

function endGame() {

  if (!running) {
    return;
  }


  running = false;


  if (animationID) {

    cancelAnimationFrame(
      animationID
    );

  }


  /*
    Add run coins permanently.
  */

  saveData.coins +=
    runCoins;


  /*
    Save best score.
  */

  if (
    score >
    saveData.bestScore
  ) {

    saveData.bestScore =
      Math.floor(score);

  }


  /*
    Unlock Blaze.
  */

  if (
    saveData.coins >= 100
  ) {

    if (
      !saveData.unlockedCharacters
        .includes("blaze")
    ) {

      saveData.unlockedCharacters
        .push("blaze");

    }

  }


  /*
    Unlock Speed Skates.
  */

  if (
    saveData.coins >= 250
  ) {

    if (
      !saveData.unlockedSkates
        .includes("speed")
    ) {

      saveData.unlockedSkates
        .push("speed");

    }

  }


  /*
    Unlock Shadow.
  */

  if (
    saveData.coins >= 500
  ) {

    if (
      !saveData.unlockedCharacters
        .includes("shadow")
    ) {

      saveData.unlockedCharacters
        .push("shadow");

    }

  }


  /*
    Unlock Shadow Skates.
  */

  if (
    saveData.coins >= 1000
  ) {

    if (
      !saveData.unlockedSkates
        .includes("shadow")
    ) {

      saveData.unlockedSkates
        .push("shadow");

    }

  }


  saveGame();


  document.getElementById(
    "finalScore"
  ).innerText =
    Math.floor(score);


  document.getElementById(
    "finalCoins"
  ).innerText =
    runCoins;


  document.getElementById(
    "finalBest"
  ).innerText =
    saveData.bestScore;


  document
    .getElementById(
      "controls"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "gameOver"
    )
    .classList.remove(
      "hidden"
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

updateMenu();

updateHUD();

</script>

</body>
  </html>
