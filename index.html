<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Shadow Rush</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02030a;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    linear-gradient(
      #07122b 0%,
      #101b3c 42%,
      #111 43%,
      #070707 100%
    );
}

/* SKY */
.skyGlow {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: #643cff;
  opacity: .25;
  filter: blur(45px);
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
}

/* WORLD */
#world {
  position: absolute;
  inset: 0;
  perspective: 650px;
  overflow: hidden;
}

.road {
  position: absolute;
  width: 58%;
  height: 150%;
  left: 21%;
  top: 35%;
  background:
    repeating-linear-gradient(
      to bottom,
      #161622 0px,
      #161622 70px,
      #202030 71px,
      #202030 140px
    );
  transform:
    perspective(500px)
    rotateX(62deg);
  transform-origin: center top;
  box-shadow:
    0 0 40px #000 inset;
}

.laneLine {
  position: absolute;
  width: 4px;
  height: 100%;
  top: 0;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.7) 0px,
      rgba(255,255,255,.7) 45px,
      transparent 45px,
      transparent 90px
    );
}

.laneLine.left {
  left: 33.33%;
}

.laneLine.right {
  left: 66.66%;
}

.groundSide {
  position: absolute;
  top: 42%;
  width: 21%;
  height: 100%;
  background:
    repeating-linear-gradient(
      to bottom,
      #063b23 0px,
      #063b23 80px,
      #07512d 80px,
      #07512d 160px
    );
}

.groundSide.left {
  left: 0;
  transform: skewY(12deg);
}

.groundSide.right {
  right: 0;
  transform: skewY(-12deg);
}

/* WORLD OBJECTS */
.worldObject {
  position: absolute;
  z-index: 10;
  transform-origin: center bottom;
  will-change: transform, left, top;
}

.coin {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background:
    radial-gradient(circle, #fff4a0 0 15%, #ffd21f 16% 55%, #b87500 56%);
  border: 3px solid #fff1a0;
  box-shadow: 0 0 18px #ffc400;
}

.obstacle {
  width: 60px;
  height: 70px;
  background:
    linear-gradient(
      90deg,
      #252532,
      #55556a,
      #171722
    );
  border: 3px solid #ff3b6b;
  border-radius: 10px 10px 4px 4px;
  box-shadow: 0 0 18px rgba(255,0,90,.5);
}

.obstacle::before {
  content: "⚠";
  position: absolute;
  font-size: 30px;
  top: 15px;
  left: 12px;
}

.barrier {
  width: 125px;
  height: 30px;
  background:
    repeating-linear-gradient(
      135deg,
      #ff314f 0 15px,
      #ffe24a 15px 30px
    );
  border: 3px solid #fff;
  border-radius: 8px;
  box-shadow: 0 0 15px #ff3155;
}

.powerup {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 25px;
  background: radial-gradient(circle,#fff,#6c4cff 45%,#2600a8);
  box-shadow: 0 0 25px #7655ff;
}

.coinPower {
  background: radial-gradient(circle,#fff,#ffd000 45%,#a85e00);
}

/* PLAYER */
#player {
  position: absolute;
  width: 58px;
  height: 92px;
  left: 50%;
  bottom: 13%;
  transform: translateX(-50%);
  z-index: 100;
  transition: left .13s ease;
}

.playerBody {
  position: absolute;
  left: 10px;
  top: 20px;
  width: 38px;
  height: 55px;
  border-radius: 18px 18px 10px 10px;
  background:
    linear-gradient(135deg,#111,#6c20ff,#151020);
  border: 2px solid #9e5cff;
  box-shadow: 0 0 25px #7b29ff;
}

.playerHead {
  position: absolute;
  left: 14px;
  top: 0;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #16131e;
  border: 2px solid #b86cff;
  box-shadow: 0 0 15px #a33dff;
}

.playerEye {
  position: absolute;
  width: 8px;
  height: 4px;
  background: #00eaff;
  top: 12px;
  left: 7px;
  border-radius: 5px;
  box-shadow: 12px 0 #00eaff;
}

.playerLeg {
  position: absolute;
  width: 10px;
  height: 25px;
  background: #171322;
  border: 2px solid #7935bb;
  bottom: 0;
}

.playerLeg.one {
  left: 12px;
}

.playerLeg.two {
  right: 12px;
}

.playerShadow {
  position: absolute;
  width: 75px;
  height: 18px;
  background: #000;
  opacity: .65;
  border-radius: 50%;
  bottom: -8px;
  left: -8px;
  filter: blur(4px);
}

/* UI */
#topUI {
  position: absolute;
  z-index: 500;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.uiBox {
  min-width: 90px;
  padding: 8px 10px;
  background: rgba(5,5,20,.78);
  border: 1px solid #743cff;
  border-radius: 10px;
  box-shadow: 0 0 12px rgba(100,40,255,.4);
  text-align: center;
}

.uiLabel {
  font-size: 10px;
  color: #aaa;
}

.uiValue {
  font-size: 17px;
  font-weight: bold;
}

/* SCREENS */
.screen {
  position: absolute;
  z-index: 1000;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    radial-gradient(
      circle at center,
      rgba(53,18,110,.35),
      rgba(0,0,0,.96)
    );
}

.panel {
  width: 100%;
  max-width: 390px;
  padding: 30px 20px;
  text-align: center;
  background: rgba(7,7,20,.94);
  border: 2px solid #733cff;
  border-radius: 22px;
  box-shadow:
    0 0 45px rgba(108,45,255,.5);
}

.logo {
  font-size: 42px;
  font-weight: 900;
  color: #b56cff;
  text-shadow:
    0 0 10px #762cff,
    0 0 30px #762cff;
  margin-bottom: 5px;
}

.subtitle {
  color: #aaa;
  letter-spacing: 4px;
  margin-bottom: 30px;
}

.menuButton {
  width: 90%;
  padding: 14px;
  margin: 8px auto;
  border: 2px solid #783dff;
  border-radius: 12px;
  background: #0d0920;
  color: #d4b5ff;
  font-size: 17px;
  font-weight: bold;
}

.menuButton:active {
  transform: scale(.96);
}

.hidden {
  display: none !important;
}

/* MOBILE CONTROLS */
#controls {
  position: absolute;
  z-index: 600;
  left: 0;
  right: 0;
  bottom: 18px;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  pointer-events: none;
}

.controlButton {
  width: 72px;
  height: 55px;
  border-radius: 15px;
  border: 2px solid rgba(150,100,255,.8);
  background: rgba(10,5,30,.65);
  color: white;
  font-size: 25px;
  pointer-events: auto;
}

.centerControls {
  display: flex;
  gap: 8px;
}

/* POWERUP MESSAGE */
#powerMessage {
  position: absolute;
  z-index: 700;
  top: 95px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-weight: bold;
  text-shadow: 0 0 12px #9b5cff;
  opacity: 0;
  transition: opacity .2s;
}

/* MISSION */
.mission {
  margin: 15px 0;
  padding: 12px;
  border: 1px solid #5430a5;
  border-radius: 10px;
  text-align: left;
  color: #ddd;
}
</style>
</head>

<body>

<div id="game">

  <div class="skyGlow"></div>

  <div id="world">

    <div class="groundSide left"></div>
    <div class="groundSide right"></div>

    <div class="road">
      <div class="laneLine left"></div>
      <div class="laneLine right"></div>
    </div>

  </div>

  <div id="player">

    <div class="playerHead">
      <div class="playerEye"></div>
    </div>

    <div class="playerBody"></div>

    <div class="playerLeg one"></div>
    <div class="playerLeg two"></div>

    <div class="playerShadow"></div>

  </div>


  <div id="topUI">

    <div class="uiBox">
      <div class="uiLabel">SCORE</div>
      <div class="uiValue" id="score">0</div>
    </div>

    <div class="uiBox">
      <div class="uiLabel">MULTIPLIER</div>
      <div class="uiValue" id="multiplier">x1</div>
    </div>

    <div class="uiBox">
      <div class="uiLabel">COINS</div>
      <div class="uiValue" id="coins">0</div>
    </div>

  </div>


  <div id="powerMessage"></div>


  <div id="controls">

    <button class="controlButton"
            id="leftButton">
      ◀
    </button>

    <div class="centerControls">
      <button class="controlButton"
              id="jumpButton">
        ▲
      </button>

      <button class="controlButton"
              id="slideButton">
        ▼
      </button>
    </div>

    <button class="controlButton"
            id="rightButton">
      ▶
    </button>

  </div>


  <!-- LOADING -->

  <div id="loadingScreen" class="screen">

    <div class="panel">

      <div class="logo">SHADOW RUSH</div>

      <p class="subtitle">SYSTEM INITIALIZING...</p>

      <p id="loadingText">
        Loading Shadow World...
      </p>

    </div>

  </div>


  <!-- MENU -->

  <div id="menuScreen" class="screen hidden">

    <div class="panel">

      <div class="logo">SHADOW RUSH</div>

      <div class="subtitle">
        RUN BEYOND YOUR LIMITS
      </div>

      <p>
        🪙 Coins:
        <strong id="menuCoins">0</strong>
      </p>

      <p>
        🏆 Best Score:
        <strong id="menuBest">0</strong>
      </p>

      <button class="menuButton"
              id="startButton">
        ⚔️ START RUN
      </button>

      <button class="menuButton"
              id="missionButton">
        🎯 MISSIONS
      </button>

      <button class="menuButton"
              id="resetButton">
        ♻️ RESET SAVE
      </button>

    </div>

  </div>


  <!-- MISSION SCREEN -->

  <div id="missionScreen" class="screen hidden">

    <div class="panel">

      <div class="logo"
           style="font-size:32px;">
        MISSIONS
      </div>

      <div class="mission">
        🪙 Collect 25 coins<br>
        <span id="missionCoins">0 / 25</span>
      </div>

      <div class="mission">
        🏃 Reach 2,000 score<br>
        <span id="missionScore">0 / 2000</span>
      </div>

      <div class="mission">
        ⚡ Collect 3 power-ups<br>
        <span id="missionPower">0 / 3</span>
      </div>

      <button class="menuButton"
              id="missionBack">
        ↩ BACK
      </button>

    </div>

  </div>


  <!-- GAME OVER -->

  <div id="gameOverScreen"
       class="screen hidden">

    <div class="panel">

      <div class="logo"
           style="font-size:34px;">
        RUN OVER
      </div>

      <h2 id="finalScore">
        SCORE: 0
      </h2>

      <p>
        🪙 Coins:
        <strong id="finalCoins">0</strong>
      </p>

      <p>
        🏆 Best:
        <strong id="finalBest">0</strong>
      </p>

      <button class="menuButton"
              id="retryButton">
        ⚔️ RUN AGAIN
      </button>

      <button class="menuButton"
              id="homeButton">
        🏠 MAIN MENU
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SAVE DATA
===================================================== */

const SAVE_KEY = "shadowRushSave_v1";

let save = {
  coins: 0,
  bestScore: 0
};

function loadSave() {

  try {

    const data =
      localStorage.getItem(SAVE_KEY);

    if (data) {
      save = {
        ...save,
        ...JSON.parse(data)
      };
    }

  } catch (error) {
    console.log("Save error:", error);
  }

}

function saveGame() {

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(save)
  );

}


/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;

let score = 0;

let runCoins = 0;

let multiplier = 1;

let speed = 0.55;

let lane = 1;

let targetLane = 1;

let jumping = false;

let sliding = false;

let jumpTimer = 0;

let slideTimer = 0;

let spawnTimer = 0;

let powerTimer = 0;

let lastTime = 0;

let objects = [];

let powerMode = "";

let powerTime = 0;

let missionPowerCount = 0;


/* =====================================================
   DOM
===================================================== */

const world =
  document.getElementById("world");

const player =
  document.getElementById("player");


/* =====================================================
   SCREENS
===================================================== */

function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.add("hidden");

    });

  document
    .getElementById(id)
    .classList.remove("hidden");

}

function updateMenu() {

  document.getElementById(
    "menuCoins"
  ).textContent =
    save.coins.toLocaleString();

  document.getElementById(
    "menuBest"
  ).textContent =
    save.bestScore.toLocaleString();

}


/* =====================================================
   LOADING
===================================================== */

setTimeout(() => {

  document.getElementById(
    "loadingText"
  ).textContent =
    "System Online...";

}, 700);

setTimeout(() => {

  loadSave();

  updateMenu();

  showScreen("menuScreen");

}, 1400);


/* =====================================================
   START GAME
===================================================== */

function startGame() {

  score = 0;

  runCoins = 0;

  multiplier = 1;

  speed = 0.55;

  lane = 1;

  targetLane = 1;

  jumping = false;

  sliding = false;

  powerMode = "";

  powerTime = 0;

  spawnTimer = 0;

  powerTimer = 0;

  missionPowerCount = 0;

  objects.forEach(
    object => object.el.remove()
  );

  objects = [];

  updatePlayerPosition();

  updateUI();

  running = true;

  showScreen("gameScreen");

  document
    .getElementById("gameOverScreen")
    .classList.add("hidden");

  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   CREATE GAME SCREEN STATE
===================================================== */

const gameScreen =
  document.createElement("div");

gameScreen.id = "gameScreen";

gameScreen.className =
  "hidden";

gameScreen.style.position =
  "absolute";

gameScreen.style.inset = "0";

gameScreen.style.zIndex = "1";

document
  .getElementById("game")
  .appendChild(gameScreen);


/* =====================================================
   PLAYER LANE
===================================================== */

function updatePlayerPosition() {

  const positions = [
    33.5,
    50,
    66.5
  ];

  player.style.left =
    positions[targetLane] + "%";

}


/* =====================================================
   LANE CHANGE
===================================================== */

function moveLeft() {

  if (!running) return;

  targetLane =
    Math.max(
      0,
      targetLane - 1
    );

  updatePlayerPosition();

}

function moveRight() {

  if (!running) return;

  targetLane =
    Math.min(
      2,
      targetLane + 1
    );

  updatePlayerPosition();

}


/* =====================================================
   JUMP
===================================================== */

function jump() {

  if (
    !running ||
    jumping ||
    sliding
  ) {
    return;
  }

  jumping = true;

  jumpTimer = 650;

  player.style.transition =
    "transform .18s ease";

  player.style.transform =
    "translateX(-50%) translateY(-110px)";

}


/* =====================================================
   SLIDE
===================================================== */

function slide() {

  if (
    !running ||
    sliding ||
    jumping
  ) {
    return;
  }

  sliding = true;

  slideTimer = 650;

  player.style.transform =
    "translateX(-50%) scaleY(.55) translateY(35px)";

}


/* =====================================================
   BUTTONS
===================================================== */

document
  .getElementById("leftButton")
  .addEventListener(
    "pointerdown",
    moveLeft
  );

document
  .getElementById("rightButton")
  .addEventListener(
    "pointerdown",
    moveRight
  );

document
  .getElementById("jumpButton")
  .addEventListener(
    "pointerdown",
    jump
  );

document
  .getElementById("slideButton")
  .addEventListener(
    "pointerdown",
    slide
  );


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "ArrowLeft") {
      moveLeft();
    }

    if (event.key === "ArrowRight") {
      moveRight();
    }

    if (
      event.key === "ArrowUp" ||
      event.key === " "
    ) {
      jump();
    }

    if (event.key === "ArrowDown") {
      slide();
    }

  }
);


/* =====================================================
   SWIPES
===================================================== */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener(
  "touchstart",
  event => {

    if (!running) return;

    const touch =
      event.changedTouches[0];

    touchStartX =
      touch.clientX;

    touchStartY =
      touch.clientY;

  },
  {passive:true}
);

document.addEventListener(
  "touchend",
  event => {

    if (!running) return;

    const touch =
      event.changedTouches[0];

    const dx =
      touch.clientX -
      touchStartX;

    const dy =
      touch.clientY -
      touchStartY;

    const absX =
      Math.abs(dx);

    const absY =
      Math.abs(dy);

    if (
      Math.max(absX, absY) < 30
    ) {
      return;
    }

    if (absX > absY) {

      if (dx > 0) {
        moveRight();
      } else {
        moveLeft();
      }

    } else {

      if (dy < 0) {
        jump();
      } else {
        slide();
      }

    }

  },
  {passive:true}
);


/* =====================================================
   SPAWN OBJECT
===================================================== */

function spawnObject(type, objectLane) {

  const el =
    document.createElement("div");

  el.className =
    "worldObject " + type;

  world.appendChild(el);

  const object = {

    el: el,

    type: type,

    lane: objectLane,

    y: -100,

    size: 1

  };

  objects.push(object);

  return object;

}


/* =====================================================
   SPAWN COIN LINE
===================================================== */

function spawnCoins() {

  const objectLane =
    Math.floor(
      Math.random() * 3
    );

  for (
    let i = 0;
    i < 5;
    i++
  ) {

    const coin =
      spawnObject(
        "coin",
        objectLane
      );

    coin.y =
      -100 -
      i * 75;

  }

}


/* =====================================================
   SPAWN OBSTACLE
===================================================== */

function spawnObstacle() {

  const objectLane =
    Math.floor(
      Math.random() * 3
    );

  const types = [
    "obstacle",
    "barrier"
  ];

  const type =
    types[
      Math.floor(
        Math.random() *
        types.length
      )
    ];

  spawnObject(
    type,
    objectLane
  );

}


/* =====================================================
   SPAWN POWERUP
===================================================== */

function spawnPowerup() {

  const objectLane =
    Math.floor(
      Math.random() * 3
    );

  const powerTypes = [
    "⚡",
    "🛡️",
    "🪙"
  ];

  const type =
    powerTypes[
      Math.floor(
        Math.random() *
        powerTypes.length
      )
    ];

  const object =
    spawnObject(
      "powerup",
      objectLane
    );

  object.powerType =
    type;

  object.el.textContent =
    type;

}


/* =====================================================
   OBJECT POSITION
===================================================== */

function updateObject(object) {

  object.y +=
    speed * 7;

  const progress =
    Math.max(
      0,
      Math.min(
        1,
        (object.y + 100) /
        (window.innerHeight + 150)
      )
    );

  const scale =
    .35 +
    progress * 1.5;

  const lanePositions = [
    33.5,
    50,
    66.5
  ];

  object.el.style.left =
    lanePositions[object.lane] + "%";

  object.el.style.top =
    object.y + "px";

  object.el.style.transform =
    "translateX(-50%) scale(" +
    scale +
    ")";

}


/* =====================================================
   COLLISION
===================================================== */

function checkCollision(object) {

  const playerLane =
    targetLane;

  if (
    object.lane !== playerLane
  ) {
    return false;
  }

  const objectBottom =
    object.y +
    60;

  const playerY =
    window.innerHeight *
    .78;

  const distance =
    Math.abs(
      objectBottom -
      playerY
    );

  return distance < 85;

}


/* =====================================================
   HANDLE OBJECT
===================================================== */

function handleObject(object) {

  if (
    object.type === "coin"
  ) {

    runCoins++;

    score +=
      25 * multiplier;

    object.el.remove();

    return;

  }


  if (
    object.type === "powerup"
  ) {

    activatePower(
      object.powerType
    );

    missionPowerCount++;

    object.el.remove();

    return;

  }


  if (
    object.type === "obstacle"
  ) {

    if (
      jumping ||
      sliding
    ) {
      return;
    }

    endGame();

    return;

  }


  if (
    object.type === "barrier"
  ) {

    if (jumping) {
      return;
    }

    endGame();

  }

}


/* =====================================================
   POWERUPS
===================================================== */

function activatePower(type) {

  if (
    type === "⚡"
  ) {

    powerMode =
      "speed";

    powerTime =
      5000;

    showPowerMessage(
      "⚡ SHADOW SPEED!"
    );

  }

  if (
    type === "🛡️"
  ) {

    powerMode =
      "shield";

    powerTime =
      6000;

    showPowerMessage(
      "🛡️ SHADOW SHIELD!"
    );

  }

  if (
    type === "🪙"
  ) {

    powerMode =
      "coins";

    powerTime =
      6000;

    showPowerMessage(
      "🪙 COIN BOOST!"
    );

  }

}

function showPowerMessage(text) {

  const message =
    document.getElementById(
      "powerMessage"
    );

  message.textContent =
    text;

  message.style.opacity =
    "1";

  setTimeout(() => {

    message.style.opacity =
      "0";

  }, 1200);

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

  if (!running) {
    return;
  }

  const delta =
    time -
    lastTime;

  lastTime =
    time;

  /* SPEED */

  speed +=
    delta * 0.000004;

  if (
    powerMode === "speed"
  ) {
    speed *= 1.003;
  }

  /* SCORE */

  score +=
    delta *
    0.025 *
    multiplier;

  /* MULTIPLIER */

  multiplier =
    Math.min(
      10,
      1 +
      Math.floor(
        score / 1000
      )
    );

  /* JUMP */

  if (jumping) {

    jumpTimer -=
      delta;

    if (
      jumpTimer <= 0
    ) {

      jumping = false;

      player.style.transform =
        "translateX(-50%)";

    }

  }

  /* SLIDE */

  if (sliding) {

    slideTimer -=
      delta;

    if (
      slideTimer <= 0
    ) {

      sliding = false;

      player.style.transform =
        "translateX(-50%)";

    }

  }

  /* POWER TIMER */

  if (
    powerMode
  ) {

    powerTime -=
      delta;

    if (
      powerTime <= 0
    ) {

      powerMode =
        "";

    }

  }

  /* SPAWNING */

  spawnTimer -=
    delta;

  if (
    spawnTimer <= 0
  ) {

    const roll =
      Math.random();

    if (
      roll < .45
    ) {

      spawnCoins();

    }

    else {

      spawnObstacle();

    }

    spawnTimer =
      Math.max(
        400,
        850 -
        speed * 100
      );

  }

  /* POWERUPS */

  powerTimer -=
    delta;

  if (
    powerTimer <= 0
  ) {

    if (
      Math.random() < .55
    ) {

      spawnPowerup();

    }

    powerTimer =
      5000 +
      Math.random() * 4000;

  }

  /* OBJECTS */

  for (
    let i = objects.length - 1;
    i >= 0;
    i--
  ) {

    const object =
      objects[i];

    updateObject(
      object
    );

    if (
      checkCollision(
        object
      )
    ) {

      if (
        powerMode ===
        "shield" &&
        (
          object.type ===
          "obstacle" ||
          object.type ===
          "barrier"
        )
      ) {

        showPowerMessage(
          "🛡️ SHIELD BLOCKED!"
        );

        object.el.remove();

        objects.splice(
          i,
          1
        );

        continue;

      }

      handleObject(
        object
      );

      if (
        !running
      ) {
        return;
      }

      if (
        !object.el.parentNode
      ) {

        objects.splice(
          i,
          1
        );

        continue;

      }

    }

    if (
      object.y >
      window.innerHeight +
      150
    ) {

      object.el.remove();

      objects.splice(
        i,
        1
      );

    }

  }

  updateUI();

  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

  document.getElementById(
    "score"
  ).textContent =
    Math.floor(
      score
    ).toLocaleString();

  document.getElementById(
    "multiplier"
  ).textContent =
    "x" +
    multiplier;

  document.getElementById(
    "coins"
  ).textContent =
    (
      save.coins +
      runCoins
    ).toLocaleString();

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

  if (!running) {
    return;
  }

  running = false;

  const final =
    Math.floor(
      score
    );

  save.coins +=
    runCoins;

  if (
    final >
    save.bestScore
  ) {

    save.bestScore =
      final;

  }

  saveGame();

  document.getElementById(
    "finalScore"
  ).textContent =
    "SCORE: " +
    final.toLocaleString();

  document.getElementById(
    "finalCoins"
  ).textContent =
    runCoins.toLocaleString();

  document.getElementById(
    "finalBest"
  ).textContent =
    save.bestScore.toLocaleString();

  updateMissionUI();

  showScreen(
    "gameOverScreen"
  );

}


/* =====================================================
   MISSIONS
===================================================== */

function updateMissionUI() {

  document.getElementById(
    "missionCoins"
  ).textContent =
    Math.min(
      runCoins,
      25
    ) +
    " / 25";

  document.getElementById(
    "missionScore"
  ).textContent =
    Math.min(
      Math.floor(score),
      2000
    ) +
    " / 2000";

  document.getElementById(
    "missionPower"
  ).textContent =
    Math.min(
      missionPowerCount,
      3
    ) +
    " / 3";

}


/* =====================================================
   MENU BUTTONS
===================================================== */

document
  .getElementById("startButton")
  .onclick = () => {

    startGame();

  };


document
  .getElementById("retryButton")
  .onclick = () => {

    startGame();

  };


document
  .getElementById("homeButton")
  .onclick = () => {

    updateMenu();

    showScreen(
      "menuScreen"
    );

  };


document
  .getElementById("missionButton")
  .onclick = () => {

    updateMissionUI();

    showScreen(
      "missionScreen"
    );

  };


document
  .getElementById("missionBack")
  .onclick = () => {

    updateMenu();

    showScreen(
      "menuScreen"
    );

  };


/* =====================================================
   RESET SAVE
===================================================== */

document
  .getElementById("resetButton")
  .onclick = () => {

    const confirmReset =
      confirm(
        "Reset all Shadow Rush coins and high score?"
      );

    if (
      !confirmReset
    ) {
      return;
    }

    localStorage.removeItem(
      SAVE_KEY
    );

    save = {
      coins: 0,
      bestScore: 0
    };

    updateMenu();

  };


/* =====================================================
   INITIAL MENU
===================================================== */

loadSave();

updateMenu();

</script>
