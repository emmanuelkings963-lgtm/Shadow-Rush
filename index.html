<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SHADOW RUSH 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:15px;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-around;
    color:white;
    pointer-events:none;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

.stat{
    text-align:center;
}

.stat small{
    display:block;
    opacity:.7;
    font-size:11px;
}

.stat span{
    font-size:21px;
}

#menu,
#gameover,
#loading{
    position:fixed;
    inset:0;
    z-index:30;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at center,#14233a 0%,#05070b 65%);
    color:white;
    text-align:center;
}

#gameover,
#loading{
    display:none;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:5px;
    text-shadow:
      0 0 10px #00aaff,
      0 0 30px #0066ff;
}

.subtitle{
    margin-top:8px;
    color:#77cfff;
    letter-spacing:4px;
}

button{
    margin-top:30px;
    padding:15px 42px;
    border:1px solid #00aaff;
    border-radius:10px;
    background:#071725;
    color:white;
    font-size:18px;
    font-weight:bold;
    box-shadow:
      0 0 15px rgba(0,170,255,.5);
}

button:active{
    transform:scale(.95);
}

#controls{
    position:fixed;
    bottom:18px;
    left:0;
    right:0;
    z-index:20;
    display:flex;
    justify-content:space-around;
    pointer-events:none;
}

.control{
    width:65px;
    height:65px;
    border-radius:50%;
    background:rgba(0,20,35,.65);
    border:1px solid rgba(0,180,255,.5);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    pointer-events:auto;
    user-select:none;
}

#message{
    position:fixed;
    top:90px;
    left:0;
    right:0;
    z-index:15;
    text-align:center;
    color:#6fd7ff;
    font-size:17px;
    font-weight:bold;
    text-shadow:0 0 10px #008cff;
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div class="stat">
        <small>SCORE</small>
        <span id="score">0</span>
    </div>

    <div class="stat">
        <small>COINS</small>
        <span id="coins">0</span>
    </div>

    <div class="stat">
        <small>SPEED</small>
        <span id="speed">1.0x</span>
    </div>

    <div class="stat">
        <small>BEST</small>
        <span id="best">0</span>
    </div>
</div>

<div id="message"></div>

<div id="menu">
    <div class="logo">SHADOW RUSH</div>
    <div class="subtitle">3D RUNNER</div>
    <button id="startBtn">START RUN</button>
</div>

<div id="loading">
    <div class="logo" style="font-size:28px">LOADING</div>
    <div style="margin-top:15px">Preparing Shadow Runner...</div>
</div>

<div id="gameover">
    <div class="logo" style="font-size:34px">RUN ENDED</div>

    <div style="margin-top:20px">
        SCORE
        <div id="finalScore"
             style="font-size:35px;margin-top:5px">
            0
        </div>
    </div>

    <div style="margin-top:15px">
        COINS
        <div id="finalCoins"
             style="font-size:25px;margin-top:5px">
            0
        </div>
    </div>

    <button id="restartBtn">RUN AGAIN</button>
</div>

<div id="controls">
    <div class="control" id="leftBtn">←</div>
    <div class="control" id="jumpBtn">↑</div>
    <div class="control" id="slideBtn">↓</div>
    <div class="control" id="rightBtn">→</div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


// ======================================================
// BASIC SETUP
// ======================================================

const game = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050912);

scene.fog = new THREE.Fog(
    0x050912,
    35,
    170
);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    .1,
    300
);

camera.position.set(
    0,
    4.2,
    9
);

camera.lookAt(
    0,
    1.2,
    -15
);


const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.7)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

game.appendChild(renderer.domElement);


// ======================================================
// LIGHTING
// ======================================================

const hemi = new THREE.HemisphereLight(
    0x9bdcff,
    0x080812,
    2
);

scene.add(hemi);


const moon = new THREE.DirectionalLight(
    0xffffff,
    3
);

moon.position.set(
    -15,
    25,
    10
);

moon.castShadow = true;

moon.shadow.mapSize.width = 1024;
moon.shadow.mapSize.height = 1024;

moon.shadow.camera.left = -30;
moon.shadow.camera.right = 30;
moon.shadow.camera.top = 40;
moon.shadow.camera.bottom = -10;

scene.add(moon);


// ======================================================
// ROAD
// ======================================================

const roadWidth = 9;
const roadLength = 500;

const road = new THREE.Mesh(
    new THREE.BoxGeometry(
        roadWidth,
        .25,
        roadLength
    ),
    new THREE.MeshStandardMaterial({
        color:0x101722,
        roughness:.85
    })
);

road.position.set(
    0,
    -.15,
    -180
);

road.receiveShadow = true;

scene.add(road);


// ======================================================
// LANE MARKERS
// ======================================================

const laneMarkers = [];

for(let z=0; z>-500; z-=10){

    for(const x of [-1.5,1.5]){

        const marker =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .07,
                    .03,
                    5
                ),
                new THREE.MeshBasicMaterial({
                    color:0x158ac0
                })
            );

        marker.position.set(
            x,
            .02,
            z
        );

        scene.add(marker);

        laneMarkers.push(marker);
    }
}


// ======================================================
// SIDE LIGHTS
// ======================================================

const sideLights = [];

for(let z=0; z>-500; z-=8){

    for(const x of [-6,6]){

        const pole =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .05,
                    .05,
                    2.8,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x202a38
                })
            );

        pole.position.set(
            x,
            1.3,
            z
        );

        scene.add(pole);


        const lamp =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .16,
                    10,
                    10
                ),
                new THREE.MeshBasicMaterial({
                    color:0x00bfff
                })
            );

        lamp.position.set(
            x,
            2.75,
            z
        );

        scene.add(lamp);

        sideLights.push({
            pole,
            lamp
        });
    }
}


// ======================================================
// PLAYER
// ======================================================

const player =
    new THREE.Group();

player.position.set(
    0,
    0,
    3
);

scene.add(player);

let playerModel = null;
let mixer = null;

let runAction = null;
let idleAction = null;


// CC0 Quaternius-derived human model.
// It contains a rig and walking/idle animations.
const HUMAN_MODEL =
'https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human.glb';


const loader =
    new GLTFLoader();


function createFallbackPlayer(){

    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .42,
                .95,
                6,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x111827
            })
        );

    body.position.y = 1.15;

    body.castShadow = true;

    player.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .34,
                20,
                20
            ),
            new THREE.MeshStandardMaterial({
                color:0xb87855
            })
        );

    head.position.y = 2.05;

    head.castShadow = true;

    player.add(head);


    const makeLimb = () => {

        const limb =
            new THREE.Mesh(
                new THREE.CapsuleGeometry(
                    .12,
                    .7,
                    5,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x151b26
                })
            );

        limb.castShadow = true;

        return limb;
    };


    const armL = makeLimb();
    armL.position.set(-.55,1.3,0);
    armL.rotation.z=-.15;

    const armR = makeLimb();
    armR.position.set(.55,1.3,0);
    armR.rotation.z=.15;

    const legL = makeLimb();
    legL.position.set(-.22,.48,0);

    const legR = makeLimb();
    legR.position.set(.22,.48,0);

    player.add(
        armL,
        armR,
        legL,
        legR
    );

    player.userData.fallback = {
        armL,
        armR,
        legL,
        legR
    };
}


createFallbackPlayer();


loader.load(
    HUMAN_MODEL,

    (gltf)=>{

        if(playerModel)
            player.remove(playerModel);

        playerModel = gltf.scene;

        playerModel.scale.setScalar(
            .32
        );

        playerModel.position.y =
            0;

        playerModel.rotation.y =
            Math.PI;

        playerModel.traverse(
            obj=>{

                if(obj.isMesh){

                    obj.castShadow = true;
                    obj.receiveShadow = true;

                }

            }
        );

        player.add(playerModel);


        mixer =
            new THREE.AnimationMixer(
                playerModel
            );

        if(gltf.animations.length){

            const clip =
                gltf.animations[0];

            runAction =
                mixer.clipAction(
                    clip
                );

            runAction.play();
        }

    },

    undefined,

    ()=>{
        console.log(
            "Human model failed to load. Using fallback."
        );
    }
);


// ======================================================
// GAME VARIABLES
// ======================================================

const lanes = [-3,0,3];

let lane = 1;

let targetX = 0;

let gameRunning = false;

let gameOver = false;

let score = 0;

let coins = 0;

let speed = .65;

let distance = 0;

let spawnTimer = 0;

let coinTimer = 0;

let jumpVelocity = 0;

let verticalVelocity = 0;

let isJumping = false;

let isSliding = false;

let slideTimer = 0;

let multiplier = 1;

let best =
    Number(
        localStorage.getItem(
            "shadowRushBest"
        ) || 0
    );

document.getElementById("best")
    .textContent = best;


// ======================================================
// OBJECT ARRAYS
// ======================================================

const obstacles = [];

const coinObjects = [];


// ======================================================
// CREATE OBSTACLE
// ======================================================

function createObstacle(){

    const laneIndex =
        Math.floor(
            Math.random()*3
        );

    const x =
        lanes[laneIndex];


    const type =
        Math.random() < .25
        ? "high"
        : "block";


    let obstacle;


    if(type==="high"){

        obstacle =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    2.4,
                    .65,
                    1
                ),
                new THREE.MeshStandardMaterial({
                    color:0x6b19ff,
                    emissive:0x180044
                })
            );

        obstacle.position.y =
            2.1;

    }else{

        obstacle =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    2.1,
                    1.5,
                    1.3
                ),
                new THREE.MeshStandardMaterial({
                    color:0x202c3b,
                    emissive:0x03101c
                })
            );

        obstacle.position.y =
            .75;
    }


    obstacle.position.x = x;

    obstacle.position.z =
        -120;


    obstacle.castShadow = true;

    obstacle.receiveShadow = true;

    scene.add(obstacle);

    obstacles.push({
        mesh:obstacle,
        type
    });
}


// ======================================================
// CREATE COIN
// ======================================================

function createCoin(){

    const coin =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .32,
                .11,
                12,
                24
            ),
            new THREE.MeshStandardMaterial({
                color:0xffd83d,
                emissive:0x664400,
                metalness:.7,
                roughness:.25
            })
        );

    const laneIndex =
        Math.floor(
            Math.random()*3
        );

    coin.position.set(
        lanes[laneIndex],
        1.25,
        -120
    );

    coin.rotation.x =
        Math.PI/2;

    coin.castShadow = true;

    scene.add(coin);

    coinObjects.push(coin);
}


// ======================================================
// PARTICLES
// ======================================================

const particleGeometry =
    new THREE.SphereGeometry(
        .035,
        5,
        5
    );

const particleMaterial =
    new THREE.MeshBasicMaterial({
        color:0x00aaff
    });

const particles = [];

for(let i=0;i<100;i++){

    const p =
        new THREE.Mesh(
            particleGeometry,
            particleMaterial
        );

    p.position.set(
        (Math.random()-.5)*40,
        Math.random()*12,
        -Math.random()*180
    );

    scene.add(p);

    particles.push(p);
}


// ======================================================
// PLAYER MOVEMENT
// ======================================================

function moveLeft(){

    if(!gameRunning) return;

    lane--;

    if(lane<0)
        lane=0;

    targetX =
        lanes[lane];
}


function moveRight(){

    if(!gameRunning) return;

    lane++;

    if(lane>2)
        lane=2;

    targetX =
        lanes[lane];
}


function jump(){

    if(!gameRunning) return;

    if(!isJumping && !isSliding){

        verticalVelocity =
            8.5;

        isJumping = true;
    }
}


function slide(){

    if(!gameRunning) return;

    if(!isJumping){

        isSliding = true;

        slideTimer = .65;
    }
}


// ======================================================
// COLLISION
// ======================================================

function checkCollision(

    a,
    b,
    extraX=.8,
    extraZ=.7

){

    const dx =
        Math.abs(
            a.position.x -
            b.position.x
        );

    const dz =
        Math.abs(
            a.position.z -
            b.position.z
        );

    return (
        dx < extraX &&
        dz < extraZ
    );
}


// ======================================================
// GAME START
// ======================================================

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "gameover"
    ).style.display="none";

    gameRunning=true;
    gameOver=false;

    score=0;
    coins=0;
    speed=.65;
    distance=0;

    lane=1;

    targetX=0;

    player.position.set(
        0,
        0,
        3
    );

    verticalVelocity=0;

    isJumping=false;

    isSliding=false;

    obstacles.forEach(
        o=>scene.remove(o.mesh)
    );

    obstacles.length=0;

    coinObjects.forEach(
        c=>scene.remove(c)
    );

    coinObjects.length=0;

    updateHUD();
}


// ======================================================
// GAME END
// ======================================================

function endGame(){

    if(!gameRunning)
        return;

    gameRunning=false;

    gameOver=true;

    if(score>best){

        best=score;

        localStorage.setItem(
            "shadowRushBest",
            best
        );
    }

    document.getElementById(
        "finalScore"
    ).textContent =
        Math.floor(score);

    document.getElementById(
        "finalCoins"
    ).textContent =
        coins;

    document.getElementById(
        "gameover"
    ).style.display="flex";

    updateHUD();
}


// ======================================================
// HUD
// ======================================================

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent =
        Math.floor(score);

    document.getElementById(
        "coins"
    ).textContent =
        coins;

    document.getElementById(
        "speed"
    ).textContent =
        (speed/.65).toFixed(1)+"x";

    document.getElementById(
        "best"
    ).textContent =
        best;
}


// ======================================================
// UPDATE GAME
// ======================================================

function updateGame(dt){

    if(!gameRunning)
        return;


    // --------------------------------
    // SPEED
    // --------------------------------

    speed +=
        dt*.006;

    if(speed>1.65)
        speed=1.65;


    // --------------------------------
    // SCORE
    // --------------------------------

    score +=
        dt * 10 * multiplier;


    distance +=
        speed * dt * 10;


    // --------------------------------
    // PLAYER X
    // --------------------------------

    player.position.x +=
        (
            targetX -
            player.position.x
        ) * Math.min(
            dt*12,
            1
        );


    // --------------------------------
    // JUMP
    // --------------------------------

    if(isJumping){

        player.position.y +=
            verticalVelocity*dt;

        verticalVelocity -=
            22*dt;


        if(player.position.y<=0){

            player.position.y=0;

            verticalVelocity=0;

            isJumping=false;
        }
    }


    // --------------------------------
    // SLIDE
    // --------------------------------

    if(isSliding){

        slideTimer -= dt;

        player.scale.y =
            .55;

        player.position.y =
            .15;

        if(slideTimer<=0){

            isSliding=false;

            player.scale.y=1;

            player.position.y=0;
        }
    }


    // --------------------------------
    // ANIMATION
    // --------------------------------

    if(mixer)
        mixer.update(dt);


    // fallback animation
    if(
        !playerModel &&
        player.userData.fallback
    ){

        const t =
            performance.now()*.012;

        const f =
            player.userData.fallback;

        f.armL.rotation.x =
            Math.sin(t)*.7;

        f.armR.rotation.x =
            -Math.sin(t)*.7;

        f.legL.rotation.x =
            -Math.sin(t)*.8;

        f.legR.rotation.x =
            Math.sin(t)*.8;
    }


    // --------------------------------
    // SPAWN
    // --------------------------------

    spawnTimer -= dt;

    if(spawnTimer<=0){

        createObstacle();

        spawnTimer =
            .75 +
            Math.random()*.75;
    }


    coinTimer -= dt;

    if(coinTimer<=0){

        createCoin();

        coinTimer =
            .25 +
            Math.random()*.35;
    }


    // --------------------------------
    // OBSTACLES
    // --------------------------------

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o =
            obstacles[i];

        o.mesh.position.z +=
            speed*35*dt;


        if(
            checkCollision(
                player,
                o.mesh,
                1.05,
                .9
            )
        ){

            if(o.type==="high"){

                if(!isSliding){

                    endGame();
                    return;
                }

            }else{

                if(
                    player.position.y < 1.1
                ){

                    endGame();
                    return;
                }
            }
        }


        if(
            o.mesh.position.z>15
        ){

            scene.remove(o.mesh);

            obstacles.splice(i,1);
        }
    }


    // --------------------------------
    // COINS
    // --------------------------------

    for(
        let i=coinObjects.length-1;
        i>=0;
        i--
    ){

        const c =
            coinObjects[i];

        c.position.z +=
            speed*35*dt;

        c.rotation.z +=
            dt*7;


        if(
            checkCollision(
                player,
                c,
                .9,
                .9
            )
        ){

            coins++;

            score += 50;

            scene.remove(c);

            coinObjects.splice(i,1);

            continue;
        }


        if(
            c.position.z>15
        ){

            scene.remove(c);

            coinObjects.splice(i,1);
        }
    }


    // --------------------------------
    // ROAD MOVEMENT
    // --------------------------------

    for(const marker of laneMarkers){

        marker.position.z +=
            speed*35*dt;

        if(marker.position.z>15)
            marker.position.z-=500;
    }


    // --------------------------------
    // SIDE LIGHT MOVEMENT
    // --------------------------------

    for(const item of sideLights){

        item.pole.position.z +=
            speed*35*dt;

        item.lamp.position.z =
            item.pole.position.z;

        if(
            item.pole.position.z>15
        ){

            item.pole.position.z-=500;

            item.lamp.position.z =
                item.pole.position.z;
        }
    }


    // --------------------------------
    // PARTICLES
    // --------------------------------

    for(const p of particles){

        p.position.z +=
            speed*20*dt;

        if(p.position.z>10){

            p.position.z =
                -180 -
                Math.random()*80;

            p.position.x =
                (Math.random()-.5)*40;
        }
    }


    // --------------------------------
    // CAMERA
    // --------------------------------

    camera.position.x +=
        (
            player.position.x*.35 -
            camera.position.x
        ) * Math.min(dt*4,1);

    camera.position.y +=
        (
            4.1 +
            player.position.y*.18 -
            camera.position.y
        ) * Math.min(dt*4,1);

    camera.lookAt(
        player.position.x*.25,
        1.25 +
        player.position.y*.15,
        -18
    );


    updateHUD();
}


// ======================================================
// BUTTONS
// ======================================================

document.getElementById(
    "startBtn"
).onclick = startGame;

document.getElementById(
    "restartBtn"
).onclick = startGame;

document.getElementById(
    "leftBtn"
).onclick = moveLeft;

document.getElementById(
    "rightBtn"
).onclick = moveRight;

document.getElementById(
    "jumpBtn"
).onclick = jump;

document.getElementById(
    "slideBtn"
).onclick = slide;


// ======================================================
// KEYBOARD
// ======================================================

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        )
            moveLeft();

        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        )
            moveRight();

        if(
            e.key==="ArrowUp" ||
            e.key===" "
        )
            jump();

        if(
            e.key==="ArrowDown" ||
            e.key.toLowerCase()==="s"
        )
            slide();
    }
);


// ======================================================
// SWIPE CONTROLS
// ======================================================

let touchStartX=0;
let touchStartY=0;

renderer.domElement.addEventListener(
    "touchstart",
    e=>{

        const t=e.changedTouches[0];

        touchStartX=t.clientX;
        touchStartY=t.clientY;
    },
    {passive:true}
);


renderer.domElement.addEventListener(
    "touchend",
    e=>{

        const t=e.changedTouches[0];

        const dx =
            t.clientX -
            touchStartX;

        const dy =
            t.clientY -
            touchStartY;

        const ax=Math.abs(dx);
        const ay=Math.abs(dy);


        if(
            Math.max(ax,ay)<30
        )
            return;


        if(ax>ay){

            if(dx>0)
                moveRight();
            else
                moveLeft();

        }else{

            if(dy<0)
                jump();
            else
                slide();
        }
    },
    {passive:true}
);


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


// ======================================================
// MAIN LOOP
// ======================================================

let previous =
    performance.now();


function animate(now){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            (now-previous)/1000,
            .05
        );

    previous=now;

    updateGame(dt);

    renderer.render(
        scene,
        camera
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
