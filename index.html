<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>SHADOW RUSH 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02030a;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    color:white;
}

button{
    font-family:inherit;
    border:0;
    outline:0;
    cursor:pointer;
    touch-action:manipulation;
}

/* =========================
   LOADING SCREEN
========================= */

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,rgba(0,140,255,.22),transparent 30%),
        linear-gradient(180deg,#020611 0%,#03030a 100%);
}

.loadingBox{
    width:min(90%,430px);
    text-align:center;
}

.loadingScene{
    position:relative;
    height:300px;
    margin-bottom:15px;
    overflow:hidden;
    border:1px solid rgba(0,180,255,.3);
    border-radius:20px;
    background:
        linear-gradient(180deg,rgba(0,70,130,.18),transparent),
        radial-gradient(circle at 50% 80%,rgba(0,180,255,.2),transparent 30%),
        #02040b;
}

.loadingMoon{
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    right:25px;
    top:25px;
    background:#dff6ff;
    box-shadow:0 0 40px #49cfff;
    opacity:.85;
}

.loadingRoad{
    position:absolute;
    bottom:-50px;
    left:50%;
    width:330px;
    height:250px;
    transform:translateX(-50%);
    background:
        linear-gradient(90deg,
        transparent 48%,
        rgba(0,180,255,.5) 49%,
        rgba(0,180,255,.5) 51%,
        transparent 52%);
    transform-origin:bottom;
    perspective:500px;
}

.runnerSilhouette{
    position:absolute;
    left:50%;
    bottom:40px;
    width:45px;
    height:125px;
    transform:translateX(-50%);
}

.runnerHead{
    width:34px;
    height:34px;
    margin:auto;
    border-radius:50%;
    background:#111;
    box-shadow:0 0 18px #00aaff;
}

.runnerBody{
    width:38px;
    height:60px;
    margin:4px auto;
    border-radius:18px 18px 8px 8px;
    background:#080b13;
    box-shadow:0 0 20px rgba(0,160,255,.6);
}

.runnerLeg{
    position:absolute;
    width:10px;
    height:55px;
    bottom:-28px;
    background:#090b11;
    box-shadow:0 0 12px #008cff;
    border-radius:10px;
}

.runnerLeg.left{
    left:8px;
    transform:rotate(15deg);
}

.runnerLeg.right{
    right:8px;
    transform:rotate(-15deg);
}

.loadingTitle{
    font-size:42px;
    font-weight:900;
    letter-spacing:5px;
    text-shadow:
        0 0 10px #00aaff,
        0 0 25px #0066ff;
}

.loadingText{
    margin-top:10px;
    color:#91dfff;
    letter-spacing:3px;
    font-size:13px;
}

.progress{
    width:100%;
    height:7px;
    margin-top:18px;
    background:#101722;
    border-radius:10px;
    overflow:hidden;
}

.progressBar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#008cff,#00eaff);
    box-shadow:0 0 15px #00aaff;
    transition:width .2s;
}

/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:900;
    display:none;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 40%,rgba(0,100,255,.12),transparent 40%),
        #02030a;
}

.menuBox{
    width:min(90%,420px);
    padding:35px 25px;
    text-align:center;
    border:1px solid rgba(0,180,255,.35);
    border-radius:25px;
    background:rgba(3,8,20,.9);
    box-shadow:
        0 0 40px rgba(0,100,255,.15),
        inset 0 0 30px rgba(0,100,255,.05);
}

.logo{
    font-size:43px;
    font-weight:900;
    letter-spacing:4px;
    color:white;
    text-shadow:
        0 0 8px #00aaff,
        0 0 25px #0066ff;
}

.subtitle{
    color:#73cfff;
    margin-top:8px;
    letter-spacing:3px;
    font-size:12px;
}

.startButton{
    width:100%;
    margin-top:35px;
    padding:19px;
    border-radius:14px;
    color:white;
    font-size:20px;
    font-weight:900;
    letter-spacing:3px;
    background:linear-gradient(90deg,#006cff,#00baff);
    box-shadow:
        0 0 20px rgba(0,150,255,.45),
        inset 0 0 10px rgba(255,255,255,.15);
}

.startButton:active{
    transform:scale(.97);
}

.smallInfo{
    margin-top:20px;
    color:#60748b;
    font-size:11px;
}

/* =========================
   GAME
========================= */

#game{
    position:fixed;
    inset:0;
    display:none;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
    z-index:20;
}

.hudBox{
    min-width:80px;
    padding:8px 10px;
    border-radius:10px;
    background:rgba(0,0,0,.45);
    border:1px solid rgba(0,180,255,.25);
    backdrop-filter:blur(5px);
}

.hudLabel{
    color:#65cfff;
    font-size:9px;
    letter-spacing:1px;
}

.hudValue{
    margin-top:3px;
    font-size:17px;
    font-weight:900;
}

#loadingGame{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#02030a;
}

.enterText{
    text-align:center;
}

.enterText h2{
    margin:0;
    font-size:30px;
    letter-spacing:4px;
    text-shadow:0 0 15px #00aaff;
}

.enterText p{
    color:#69cfff;
    font-size:12px;
    letter-spacing:2px;
}

/* =========================
   CONTROLS
========================= */

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:22px;
    z-index:40;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:10px;
    pointer-events:auto;
}

.controlButton{
    width:65px;
    height:65px;
    border-radius:50%;
    color:white;
    font-size:25px;
    font-weight:bold;
    background:rgba(0,20,45,.75);
    border:1px solid rgba(0,190,255,.45);
    box-shadow:0 0 15px rgba(0,120,255,.2);
}

.controlButton:active{
    transform:scale(.9);
    background:rgba(0,120,255,.65);
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(7px);
}

.gameOverBox{
    width:min(90%,390px);
    padding:30px;
    text-align:center;
    border-radius:22px;
    background:#050914;
    border:1px solid rgba(0,180,255,.35);
}

.gameOverTitle{
    font-size:38px;
    font-weight:900;
    color:#ff365c;
    text-shadow:0 0 15px #ff174f;
}

.finalScore{
    margin-top:15px;
    font-size:22px;
}

.restartButton{
    width:100%;
    margin-top:25px;
    padding:16px;
    border-radius:12px;
    color:white;
    background:linear-gradient(90deg,#006cff,#00baff);
    font-weight:bold;
    font-size:18px;
}
</style>
</head>

     LOADING SCREEN

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<!-- =====================================================
     IMPORTANT:
     THIS IS A NORMAL SCRIPT.
     START BUTTON DOES NOT DEPEND ON THREE.JS.
===================================================== -->

<script>

(function(){

    const loadingScreen =
        document.getElementById("loadingScreen");

    const menu =
        document.getElementById("menu");

    const startButton =
        document.getElementById("startButton");

    const progressBar =
        document.getElementById("progressBar");

    const loadingText =
        document.getElementById("loadingText");

    let loadingProgress = 0;

    function loadingStep(){

        loadingProgress += Math.random() * 12 + 5;

        if(loadingProgress > 100){
            loadingProgress = 100;
        }

        progressBar.style.width =
            loadingProgress + "%";

        if(loadingProgress < 30){

            loadingText.textContent =
                "INITIALIZING SYSTEM...";

        }else if(loadingProgress < 60){

            loadingText.textContent =
                "LOADING SHADOW CORE...";

        }else if(loadingProgress < 90){

            loadingText.textContent =
                "PREPARING RUNNER...";

        }else{

            loadingText.textContent =
                "SYSTEM READY";

        }

        if(loadingProgress < 100){

            setTimeout(loadingStep,180);

        }else{

            setTimeout(function(){

                loadingScreen.style.display =
                    "none";

                menu.style.display =
                    "flex";

            },500);

        }

    }

    loadingStep();


    /*
       GLOBAL START FUNCTION

       This is intentionally outside the
       Three.js module.
    */

    window.startGame = function(){

        console.log("SHADOW RUSH: START PRESSED");

        menu.style.display =
            "none";

        document.getElementById("game")
            .style.display = "block";

        if(window.bootShadowRush){

            window.bootShadowRush();

        }else{

            const status =
                document.getElementById("engineStatus");

            status.textContent =
                "STARTING 3D ENGINE...";

            /*
               Load the actual game module
               only after Start is pressed.
            */

            import("three")
                .then(function(){

                    return import(
                        "three/addons/loaders/GLTFLoader.js"
                    );

                })
                .then(function(modules){

                    window.THREE_MODULE =
                        modules;

                    return window.loadShadowRushGame();

                })
                .catch(function(error){

                    console.error(error);

                    const status =
                        document.getElementById(
                            "engineStatus"
                        );

                    status.textContent =
                        "3D ENGINE ERROR — RETRYING...";

                    /*
                       Try the game loader again.
                    */

                    setTimeout(function(){

                        if(window.loadShadowRushGame){

                            window.loadShadowRushGame();

                        }

                    },1000);

                });

        }

    };


    /*
       Multiple ways of activating the button.
       This helps on Android browsers.
    */

    startButton.addEventListener(
        "click",
        function(){

            window.startGame();

        },
        false
    );


    startButton.addEventListener(
        "touchend",
        function(event){

            event.preventDefault();

            window.startGame();

        },
        {
            passive:false
        }
    );


    /*
       RUN AGAIN
    */

    document.getElementById(
        "restartButton"
    ).addEventListener(
        "click",
        function(){

            document.getElementById(
                "gameOver"
            ).style.display = "none";

            if(window.restartShadowRush){

                window.restartShadowRush();

            }

        }
    );

})();

</script>


<!-- =====================================================
     THREE.JS GAME MODULE
===================================================== -->

<script type="module">

let THREE;
let GLTFLoader;

let scene;
let camera;
let renderer;

let player;
let playerModel = null;

let road;

let obstacles = [];
let coinsObjects = [];
let particles = [];

let animationStarted = false;
let gameStarted = false;
let gameOver = false;

let currentLane = 1;

let laneX = [-3,0,3];

let playerY = 1.1;

let verticalVelocity = 0;

let jumping = false;
let sliding = false;

let score = 0;
let coinCount = 0;

let speed = 0.38;

let distance = 0;

let spawnTimer = 0;
let coinTimer = 0;

let lastTime = 0;

const canvas =
    document.getElementById("gameCanvas");

const gameLoading =
    document.getElementById("loadingGame");

const engineStatus =
    document.getElementById("engineStatus");


/* ==========================================
   LOAD GAME ENGINE
========================================== */

window.loadShadowRushGame = async function(){

    if(gameStarted){

        return;

    }

    try{

        engineStatus.textContent =
            "LOADING 3D ENGINE...";

        /*
           Import Three.js.
        */

        const threeModule =
            await import(
                "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
            );

        THREE = threeModule;


        /*
           Try GLTFLoader separately.
        */

        try{

            const loaderModule =
                await import(
                    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js"
                );

            GLTFLoader =
                loaderModule.GLTFLoader;

        }catch(error){

            console.warn(
                "GLTF model loader unavailable.",
                error
            );

            GLTFLoader = null;

        }


        engineStatus.textContent =
            "BUILDING SHADOW WORLD...";

        initGame();

        gameStarted = true;

        gameLoading.style.display =
            "none";

        startAnimation();

    }catch(error){

        console.error(
            "Shadow Rush engine error:",
            error
        );

        engineStatus.textContent =
            "ENGINE FAILED — TAP START AGAIN";

        gameLoading.style.display =
            "flex";

        gameStarted = false;

    }

};


/* ==========================================
   INIT
========================================== */

function initGame(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x02040b);

    scene.fog =
        new THREE.Fog(
            0x02040b,
            25,
            180
        );


    camera =
        new THREE.PerspectiveCamera(
            65,
            window.innerWidth /
            window.innerHeight,
            0.1,
            500
        );

    camera.position.set(
        0,
        4.5,
        8
    );


    renderer =
        new THREE.WebGLRenderer({
            canvas:canvas,
            antialias:true,
            powerPreference:"high-performance"
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    /*
       LIGHTS
    */

    const ambient =
        new THREE.HemisphereLight(
            0x80bfff,
            0x02030a,
            1.5
        );

    scene.add(ambient);


    const moonLight =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    moonLight.position.set(
        -20,
        30,
        20
    );

    moonLight.castShadow = true;

    moonLight.shadow.mapSize.width =
        1024;

    moonLight.shadow.mapSize.height =
        1024;

    scene.add(moonLight);


    const blueLight =
        new THREE.PointLight(
            0x008cff,
            30,
            40
        );

    blueLight.position.set(
        0,
        5,
        5
    );

    scene.add(blueLight);


    /*
       ROAD
    */

    createRoad();


    /*
       ENVIRONMENT
    */

    createEnvironment();


    /*
       PLAYER
    */

    createPlayer();


    /*
       TRY REAL 3D HUMAN MODEL.
       If it fails, the procedural player remains.
    */

    loadHumanModel();


    /*
       EVENTS
    */

    setupControls();

    window.addEventListener(
        "resize",
        onResize
    );

}


/* ==========================================
   ROAD
========================================== */

function createRoad(){

    const roadGeometry =
        new THREE.BoxGeometry(
            9,
            .3,
            500
        );

    const roadMaterial =
        new THREE.MeshStandardMaterial({
            color:0x080b12,
            roughness:.75,
            metalness:.15
        });

    road =
        new THREE.Mesh(
            roadGeometry,
            roadMaterial
        );

    road.position.set(
        0,
        -0.2,
        -180
    );

    road.receiveShadow = true;

    scene.add(road);


    /*
       Lane lines
    */

    for(let i=0;i<100;i++){

        for(const x of [-1.5,1.5]){

            const geometry =
                new THREE.BoxGeometry(
                    .08,
                    .025,
                    3
                );

            const material =
                new THREE.MeshBasicMaterial({
                    color:0x159dff
                });

            const line =
                new THREE.Mesh(
                    geometry,
                    material
                );

            line.position.set(
                x,
                -.02,
                5 - i * 5
            );

            scene.add(line);

        }

    }

}


/* ==========================================
   ENVIRONMENT
========================================== */

function createEnvironment(){

    for(let i=0;i<60;i++){

        const side =
            Math.random() < .5
                ? -1
                : 1;

        const x =
            side *
            (7 + Math.random()*8);

        const z =
            -Math.random()*300;

        createBuilding(
            x,
            z
        );

    }


    /*
       Light poles
    */

    for(let i=0;i<70;i++){

        const side =
            i%2 === 0 ? -1 : 1;

        createLightPole(
            side * 6.3,
            -i * 5
        );

    }

}


/* ==========================================
   BUILDINGS
========================================== */

function createBuilding(x,z){

    const width =
        2 + Math.random()*4;

    const height =
        5 + Math.random()*15;

    const depth =
        3 + Math.random()*5;

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color(
                    .015,
                    .025 + Math.random()*.03,
                    .06 + Math.random()*.08
                ),
            roughness:.9
        });

    const building =
        new THREE.Mesh(
            geometry,
            material
        );

    building.position.set(
        x,
        height/2 - .2,
        z
    );

    building.castShadow = true;

    building.receiveShadow = true;

    scene.add(building);


    /*
       Windows
    */

    for(let y=2;y<height-1;y+=2.5){

        const windowGeometry =
            new THREE.BoxGeometry(
                .35,
                .35,
                .03
            );

        const windowMaterial =
            new THREE.MeshBasicMaterial({
                color:
                    Math.random() > .4
                    ? 0x159cff
                    : 0x102030
            });

        for(let w=0;w<2;w++){

            const windowMesh =
                new THREE.Mesh(
                    windowGeometry,
                    windowMaterial
                );

            windowMesh.position.set(
                x -
                width/2 +
                .5 +
                w*(width-1),
                y,
                z - depth/2 - .02
            );

            scene.add(windowMesh);

        }

    }

}


/* ==========================================
   LIGHT POLES
========================================== */

function createLightPole(x,z){

    const poleGeometry =
        new THREE.CylinderGeometry(
            .04,
            .06,
            4,
            8
        );

    const poleMaterial =
        new THREE.MeshStandardMaterial({
            color:0x172231,
            metalness:.8,
            roughness:.3
        });

    const pole =
        new THREE.Mesh(
            poleGeometry,
            poleMaterial
        );

    pole.position.set(
        x,
        1.8,
        z
    );

    scene.add(pole);

    );

}

/* ==========================================
   REAL HUMAN MODEL
========================================== */

function loadHumanModel(){

    if(!GLTFLoader){

        return;

    }

    const loader =
        new GLTFLoader();

    const modelURL =
        "https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human.glb";


    loader.load(

        modelURL,

        function(gltf){

            if(!gltf || !gltf.scene){

                return;

            }

            playerModel =
                gltf.scene;

            playerModel.scale.set(
                .95,
                .95,
                .95
            );

            playerModel.position.set(
                0,
                0,
                0
            );


            playerModel.traverse(
                function(object){

                    if(object.isMesh){

                        object.castShadow =
                            true;

                        object.receiveShadow =
                            true;

                    }

                }
            );


            /*
               Hide procedural player.
            */

            player.visible = false;

            player.add(
                playerModel
            );


            /*
               Animation support.
            */

            if(
                gltf.animations &&
                gltf.animations.length
            ){

                const mixer =
                    new THREE.AnimationMixer(
                        playerModel
                    );

                window.shadowMixer =
                    mixer;

                let clip =
                    gltf.animations.find(
                        a =>
                            /walk|run|idle/i
                            .test(a.name)
                    );

                if(!clip){

                    clip =
                        gltf.animations[0];

                }

                if(clip){

                    const action =
                        mixer.clipAction(
                            clip
                        );

                    action.play();

                }

            }

        },

        undefined,

        function(error){

            console.warn(
                "Human model failed. Using built-in 3D runner.",
                error
            );

        }

    );

}


/* ==========================================
   OBSTACLES
========================================== */

function spawnObstacle(){

    const lane =
        Math.floor(
            Math.random()*3
        );

    const type =
        Math.random() < .5
        ? "block"
        : "high";


    let obstacle;


    if(type === "block"){

        const geometry =
            new THREE.BoxGeometry(
                1.8,
                1.5,
                1.5
            );

        const material =
            new THREE.MeshStandardMaterial({
                color:0x131b28,
                metalness:.4,
                roughness:.45,
                emissive:0x002b50
            });

        obstacle =
            new THREE.Mesh(
                geometry,
                material
            );

        obstacle.position.y =
            .65;

    }else{

        const geometry =
            new THREE.BoxGeometry(
                2.4,
                .7,
                1.2
            );

        const material =
            new THREE.MeshStandardMaterial({
                color:0x16202e,
                metalness:.4,
                roughness:.45,
                emissive:0x300000
            });

        obstacle =
            new THREE.Mesh(
                geometry,
                material
            );

        obstacle.position.y =
            2.1;

    }


    obstacle.position.x =
        laneX[lane];

    obstacle.position.z =
        -100;

    obstacle.castShadow = true;

    obstacle.receiveShadow = true;

    obstacle.userData.type =
        type;

    scene.add(obstacle);

    obstacles.push(obstacle);

}

/* ==========================================
   CONTROLS
========================================== */

function setupControls(){

    function moveLeft(){

        if(!gameStarted || gameOver)
            return;

        currentLane =
            Math.max(
                0,
                currentLane - 1
            );

    }


    function moveRight(){

        if(!gameStarted || gameOver)
            return;

        currentLane =
            Math.min(
                2,
                currentLane + 1
            );

    }


    function jump(){

        if(!gameStarted || gameOver)
            return;

        if(!jumping){

            jumping = true;

            verticalVelocity =
                .19;

        }

    }


    function slide(){

        if(!gameStarted || gameOver)
            return;

        if(!jumping){

            sliding = true;

            setTimeout(
                function(){

                    sliding = false;

                },
                650
            );

        }

    }


    setupButton(
        "leftButton",
        moveLeft
    );

    setupButton(
        "rightButton",
        moveRight
    );

    setupButton(
        "jumpButton",
        jump
    );

    setupButton(
        "slideButton",
        slide
    );


    /*
       Keyboard
    */

    window.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "ArrowLeft" ||
                event.key.toLowerCase() === "a"
            ){

                moveLeft();

            }

            if(
                event.key === "ArrowRight" ||
                event.key.toLowerCase() === "d"
            ){

                moveRight();

            }

            if(
                event.key === "ArrowUp" ||
                event.key === " "
            ){

                jump();

            }

            if(
                event.key === "ArrowDown" ||
                event.key.toLowerCase() === "s"
            ){

                slide();

            }

        }
    );


    /*
       Swipe
    */

    let touchStartX = 0;
    let touchStartY = 0;


    window.addEventListener(
        "touchstart",
        function(event){

            if(!event.touches.length)
                return;

            touchStartX =
                event.touches[0].clientX;

            touchStartY =
                event.touches[0].clientY;

        },
        {
            passive:true
        }
    );


    window.addEventListener(
        "touchend",
        function(event){

            if(!event.changedTouches.length)
                return;

            const endX =
                event.changedTouches[0].clientX;

            const endY =
                event.changedTouches[0].clientY;

            const dx =
                endX - touchStartX;

            const dy =
                endY - touchStartY;

            const absX =
                Math.abs(dx);

            const absY =
                Math.abs(dy);

            const threshold =
                35;


            if(
                absX < threshold &&
                absY < threshold
            ){

                return;

            }


            if(absX > absY){

                if(dx > 0){

                    moveRight();

                }else{

                    moveLeft();

                }

            }else{

                if(dy < 0){

                    jump();

                }else{

                    slide();

                }

            }

        },
        {
            passive:true
        }
    );

}


/* ==========================================
   BUTTON HELPER
========================================== */

function setupButton(id,callback){

    const button =
        document.getElementById(id);

    button.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            callback();

        }
    );

    button.addEventListener(
        "touchstart",
        function(event){

            event.preventDefault();

            callback();

        },
        {
            passive:false
        }
    );

}


/* ==========================================
   START ANIMATION
========================================== */

function startAnimation(){

    if(animationStarted){

        return;

    }

    animationStarted = true;

    gameOver = false;

    lastTime =
        performance.now();

    requestAnimationFrame(
        animate
    );

}


/* ==========================================
   ANIMATION
========================================== */

function animate(time){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            (time - lastTime) / 16.67,
            2
        );

    lastTime = time;


    if(gameOver){

        renderer.render(
            scene,
            camera
        );

        return;

    }


    /*
       SPEED
    */

    speed =
        Math.min(
            .95,
            .38 + distance/80000
        );


    distance +=
        speed * delta;

    score =
        Math.floor(
            distance
        );


    /*
       PLAYER LANE MOVEMENT
    */

    if(player){

        const targetX =
            laneX[currentLane];

        player.position.x +=
            (targetX -
             player.position.x) *
            .18 *
            delta;


        /*
           Jump physics
        */

        if(jumping){

            player.position.y +=
                verticalVelocity *
                delta;

            verticalVelocity -=
                .012 *
                delta;

            if(
                player.position.y <= 0
            ){

                player.position.y = 0;

                verticalVelocity = 0;

                jumping = false;

            }

        }


        /*
           Running animation
        */

        if(
            !playerModel ||
            !player.visible
        ){

            const run =
                Math.sin(
                    time * .015
                );

            player.rotation.z =
                run * .015;

        }

    }


    /*
       Spawn
    */

    spawnTimer +=
        delta;

    coinTimer +=
        delta;


    if(spawnTimer > 55){

        spawnObstacle();

        spawnTimer = 0;

    }


    if(coinTimer > 22){

        spawnCoin();

        coinTimer = 0;

    }


    /*
       Move obstacles
    */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const obstacle =
            obstacles[i];

        obstacle.position.z +=
            speed * delta * 2.5;


        /*
           Collision
        */

        if(
            Math.abs(
                obstacle.position.z -
                player.position.z
            ) < 1.35 &&
            Math.abs(
                obstacle.position.x -
                player.position.x
            ) < 1.15
        ){

            if(
                obstacle.userData.type ===
                "block"
            ){

                if(
                    player.position.y <
                    .75
                ){

                    endGame();

                    return;

                }

            }else{

                if(
                    player.position.y >
                    1.25 &&
                    !sliding
                ){

                    endGame();

                    return;

                }

            }

        }


        if(
            obstacle.position.z > 15
        ){

            scene.remove(
                obstacle
            );

            obstacles.splice(
                i,
                1
            );

        }

    }


    /*
       Coins
    */

    for(
        let i=coinsObjects.length-1;
        i>=0;
        i--
    ){

        const coin =
            coinsObjects[i];

        coin.position.z +=
            speed * delta * 2.5;

        coin.rotation.x +=
            .05 * delta;

        coin.rotation.y +=
            .08 * delta;


        if(
            Math.abs(
                coin.position.z -
                player.position.z
            ) < 1.2 &&
            Math.abs(
                coin.position.x -
                player.position.x
            ) < 1.2 &&
            Math.abs(
                coin.position.y -
                (player.position.y + 1)
            ) < 1.2
        ){

            coinCount += 1;

            scene.remove(
                coin
            );

            coinsObjects.splice(
                i,
                1
            );

        }


        if(
            coin.position.z > 15
        ){

            scene.remove(
                coin
            );

            coinsObjects.splice(
                i,
                1
            );

        }

    }


    /*
       Camera
    */

    camera.position.x +=
        (
            player.position.x * .25 -
            camera.position.x
        ) * .08 * delta;

    camera.position.y +=
        (
            4.2 +
            player.position.y*.25 -
            camera.position.y
        ) * .08 * delta;


    camera.lookAt(
        player.position.x,
        1.1,
        -5
    );


    /*
       Animate loaded model
    */

    if(window.shadowMixer){

        window.shadowMixer.update(
            .016 * delta
        );

    }


    /*
       HUD
    */

    document.getElementById(
        "score"
    ).textContent =
        score;

    document.getElementById(
        "coins"
    ).textContent =
        coinCount;

    document.getElementById(
        "speed"
    ).textContent =
        Math.floor(
            speed * 100
        );

    document.getElementById(
        "best"
    ).textContent =
        getBest();


    renderer.render(
        scene,
        camera
    );

}


/* ==========================================
   GAME OVER
========================================== */

function endGame(){

    gameOver = true;

    saveBest();

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "finalCoins"
    ).textContent =
        coinCount;

    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";

}


/* ==========================================
   RESTART
========================================== */

window.restartShadowRush =
function(){

    /*
       Remove obstacles.
    */

    for(
        const obstacle of obstacles
    ){

        scene.remove(
            obstacle
        );

    }

    obstacles = [];


    /*
       Remove coins.
    */

    for(
        const coin of coinsObjects
    ){

        scene.remove(
            coin
        );

    }

    coinsObjects = [];


    currentLane = 1;

    player.position.set(
        0,
        0,
        3
    );

    jumping = false;

    sliding = false;

    verticalVelocity = 0;

    score = 0;

    coinCount = 0;

    speed = .38;

    distance = 0;

    spawnTimer = 0;

    coinTimer = 0;

    gameOver = false;

    document.getElementById(
        "gameOver"
    ).style.display =
        "none";

};


/* ==========================================
   BEST SCORE
========================================== */

function getBest(){

    return Number(
        localStorage.getItem(
            "shadowRushBest"
        ) || 0
    );

}


function saveBest(){

    if(
        score > getBest()
    ){

        localStorage.setItem(
            "shadowRushBest",
            score
        );

    }

}


/* ==========================================
   RESIZE
========================================== */

function onResize(){

    if(!camera || !renderer)
        return;

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}
