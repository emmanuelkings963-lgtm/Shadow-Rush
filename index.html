<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Shadow Rush</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#02030a;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  z-index:20;
  top:12px;
  left:10px;
  right:10px;

  display:flex;
  justify-content:space-between;
  gap:7px;
}

.box{
  min-width:90px;
  padding:7px 9px;
  text-align:center;

  background:rgba(5,5,18,.78);

  border:1px solid #873cff;
  border-radius:11px;

  box-shadow:0 0 14px rgba(115,45,255,.45);
}

.label{
  font-size:9px;
  color:#aaa;
}

.value{
  font-size:17px;
  font-weight:bold;
}

#powerMessage{
  position:absolute;
  z-index:30;

  top:92px;
  left:50%;

  transform:translateX(-50%);

  font-size:18px;
  font-weight:bold;

  text-shadow:0 0 15px #9c55ff;

  opacity:0;
  transition:.2s;

  pointer-events:none;
}

#controls{
  position:absolute;
  z-index:25;

  left:0;
  right:0;
  bottom:17px;

  display:flex;
  justify-content:space-between;

  padding:0 16px;

  pointer-events:none;
}

.control{
  width:70px;
  height:55px;

  border:2px solid #864bff;
  border-radius:15px;

  background:rgba(8,5,25,.72);

  color:white;
  font-size:25px;

  pointer-events:auto;
}

.center{
  display:flex;
  gap:8px;
}

.screen{
  position:absolute;
  z-index:100;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle,
      rgba(72,20,145,.35),
      rgba(0,0,0,.96)
    );
}

.panel{
  width:100%;
  max-width:390px;

  padding:30px 20px;

  text-align:center;

  background:rgba(7,7,20,.96);

  border:2px solid #7c3cff;
  border-radius:23px;

  box-shadow:
    0 0 50px rgba(105,40,255,.55);
}

.logo{
  font-size:40px;
  font-weight:900;

  color:#c080ff;

  text-shadow:
    0 0 10px #7c25ff,
    0 0 30px #7c25ff;
}

.subtitle{
  color:#aaa;

  letter-spacing:3px;

  margin:8px 0 28px;
}

button.menu{
  display:block;

  width:90%;

  margin:9px auto;

  padding:14px;

  border:2px solid #783dff;
  border-radius:13px;

  background:#0d0920;

  color:#e1caff;

  font-size:17px;
  font-weight:bold;
}

button.menu:active,
.control:active{
  transform:scale(.95);
}

.hidden{
  display:none!important;
}

.mission{
  padding:13px;

  margin:12px 0;

  border:1px solid #5630a5;
  border-radius:11px;

  text-align:left;

  color:#ddd;
}

</style>
</head>


<body>

<div id="game">

<canvas id="canvas"></canvas>


<!-- HUD -->

<div id="hud">

  <div class="box">
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>

  <div class="box">
    <div class="label">MULTIPLIER</div>
    <div class="value" id="multiplier">x1</div>
  </div>

  <div class="box">
    <div class="label">COINS</div>
    <div class="value" id="coins">0</div>
  </div>

</div>


<div id="powerMessage"></div>


<!-- CONTROLS -->

<div id="controls">

  <button class="control" id="left">
    ◀
  </button>

  <div class="center">

    <button class="control" id="jump">
      ▲
    </button>

    <button class="control" id="slide">
      ▼
    </button>

  </div>

  <button class="control" id="right">
    ▶
  </button>

</div>


<!-- LOADING -->

<div class="screen" id="loading">

  <div class="panel">

    <div class="logo">
      SHADOW RUSH
    </div>

    <div class="subtitle">
      SYSTEM INITIALIZING
    </div>

    <p id="loadText">
      Loading Shadow World...
    </p>

  </div>

</div>


<!-- MENU -->

<div class="screen hidden" id="menu">

  <div class="panel">

    <div class="logo">
      SHADOW RUSH
    </div>

    <div class="subtitle">
      RUN BEYOND YOUR LIMITS
    </div>

    <p>
      🪙 Coins:
      <b id="menuCoins">0</b>
    </p>

    <p>
      🏆 Best:
      <b id="menuBest">0</b>
    </p>

    <button class="menu" id="start">
      ▶ START RUN
    </button>

    <button class="menu" id="missions">
      🎯 MISSIONS
    </button>

    <button class="menu" id="reset">
      ♻ RESET SAVE
    </button>

  </div>

</div>


<!-- MISSIONS -->

<div class="screen hidden" id="missionScreen">

  <div class="panel">

    <div class="logo" style="font-size:32px">
      MISSIONS
    </div>

    <div class="mission">
      🪙 Collect 25 coins
      <br>
      <span id="mCoins">0 / 25</span>
    </div>

    <div class="mission">
      🏃 Reach 2,000 score
      <br>
      <span id="mScore">0 / 2000</span>
    </div>

    <div class="mission">
      ⚡ Collect 3 power-ups
      <br>
      <span id="mPower">0 / 3</span>
    </div>

    <button class="menu" id="back">
      ↩ BACK
    </button>

  </div>

</div>


<!-- GAME OVER -->

<div class="screen hidden" id="gameOver">

  <div class="panel">

    <div class="logo" style="font-size:34px">
      RUN OVER
    </div>

    <h2 id="finalScore">
      SCORE: 0
    </h2>

    <p>
      🪙 Coins:
      <b id="finalCoins">0</b>
    </p>

    <p>
      🏆 Best:
      <b id="finalBest">0</b>
    </p>

    <button class="menu" id="retry">
      ▶ RUN AGAIN
    </button>

    <button class="menu" id="home">
      🏠 MAIN MENU
    </button>

  </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;


function resize(){

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    W * DPR;

  canvas.height =
    H * DPR;

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}


window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   SAVE
===================================================== */

const SAVE_KEY =
  "shadowRushComplete_v1";


let save = {
  coins:0,
  best:0
};


function loadSave(){

  try{

    const data =
      localStorage.getItem(
        SAVE_KEY
      );

    if(data){

      save = {
        ...save,
        ...JSON.parse(data)
      };

    }

  }catch(e){

    console.log(e);

  }

}


function saveGame(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(save)
  );

}


/* =====================================================
   GAME STATE
===================================================== */

let running = false;

let score = 0;

let runCoins = 0;

let multiplier = 1;

let speed = 0.48;

let targetLane = 1;

let playerX = 1;

let jumping = false;

let sliding = false;

let jumpTime = 0;

let slideTime = 0;

let spawnTime = 0;

let powerSpawn = 0;

let objects = [];

let powerMode = "";

let powerTime = 0;

let powerCount = 0;

let lastTime = 0;

let worldOffset = 0;


/* =====================================================
   SCREEN
===================================================== */

function screen(id){

  document
    .querySelectorAll(".screen")
    .forEach(s =>
      s.classList.add("hidden")
    );

  document
    .getElementById(id)
    .classList.remove("hidden");

}


/* =====================================================
   MENU
===================================================== */

function updateMenu(){

  document.getElementById(
    "menuCoins"
  ).textContent =
    save.coins.toLocaleString();

  document.getElementById(
    "menuBest"
  ).textContent =
    save.best.toLocaleString();

}


/* =====================================================
   LOADING
===================================================== */

setTimeout(()=>{

  document.getElementById(
    "loadText"
  ).textContent =
    "Shadow World Ready...";

},700);


setTimeout(()=>{

  loadSave();

  updateMenu();

  screen("menu");

},1400);


/* =====================================================
   START
===================================================== */

function startGame(){

  score = 0;

  runCoins = 0;

  multiplier = 1;

  speed = 0.48;

  targetLane = 1;

  playerX = 1;

  jumping = false;

  sliding = false;

  jumpTime = 0;

  slideTime = 0;

  spawnTime = 500;

  powerSpawn = 3500;

  powerMode = "";

  powerTime = 0;

  powerCount = 0;

  worldOffset = 0;

  objects = [];

  running = true;

  lastTime =
    performance.now();

  document
    .getElementById("controls")
    .style.display = "flex";

  screenGame();

  requestAnimationFrame(loop);

}


/* =====================================================
   GAME SCREEN
===================================================== */

function screenGame(){

  document
    .querySelectorAll(".screen")
    .forEach(s =>
      s.classList.add("hidden")
    );

}


/* =====================================================
   LANE
===================================================== */

function moveLeft(){

  if(!running)
    return;

  targetLane =
    Math.max(
      0,
      targetLane - 1
    );

}


function moveRight(){

  if(!running)
    return;

  targetLane =
    Math.min(
      2,
      targetLane + 1
    );

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

  if(
    !running ||
    jumping ||
    sliding
  )
    return;

  jumping = true;

  jumpTime = 650;

}


/* =====================================================
   SLIDE
===================================================== */

function slide(){

  if(
    !running ||
    sliding ||
    jumping
  )
    return;

  sliding = true;

  slideTime = 650;

}


/* =====================================================
   BUTTONS
===================================================== */

document
  .getElementById("left")
  .addEventListener(
    "pointerdown",
    moveLeft
  );


document
  .getElementById("right")
  .addEventListener(
    "pointerdown",
    moveRight
  );


document
  .getElementById("jump")
  .addEventListener(
    "pointerdown",
    jump
  );


document
  .getElementById("slide")
  .addEventListener(
    "pointerdown",
    slide
  );


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e => {

    if(e.key === "ArrowLeft")
      moveLeft();

    if(e.key === "ArrowRight")
      moveRight();

    if(
      e.key === "ArrowUp" ||
      e.key === " "
    )
      jump();

    if(e.key === "ArrowDown")
      slide();

  }
);


/* =====================================================
   SWIPE
===================================================== */

let sx = 0;
let sy = 0;


canvas.addEventListener(
  "touchstart",
  e => {

    if(!running)
      return;

    sx =
      e.changedTouches[0].clientX;

    sy =
      e.changedTouches[0].clientY;

  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  e => {

    if(!running)
      return;

    const x =
      e.changedTouches[0].clientX;

    const y =
      e.changedTouches[0].clientY;

    const dx = x - sx;
    const dy = y - sy;

    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      ) < 30
    )
      return;

    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      if(dx > 0)
        moveRight();
      else
        moveLeft();

    }else{

      if(dy < 0)
        jump();
      else
        slide();

    }

  },
  {passive:true}
);


/* =====================================================
   OBJECTS
===================================================== */

function spawn(
  type,
  lane,
  z
){

  objects.push({

    type:type,

    lane:lane,

    z:z,

    collected:false,

    powerType:null

  });

}


function spawnCoins(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  for(
    let i=0;
    i<5;
    i++
  ){

    spawn(
      "coin",
      lane,
      i*.09
    );

  }

}


function spawnObstacle(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  const type =
    Math.random()<.75
    ? "block"
    : "barrier";

  spawn(
    type,
    lane,
    0
  );

}


function spawnPower(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  const o = {

    type:"power",

    lane:lane,

    z:0,

    collected:false,

    powerType:
      [
        "speed",
        "shield",
        "coins"
      ][
        Math.floor(
          Math.random()*3
        )
      ]

  };

  objects.push(o);

}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  sky.addColorStop(
    0,
    "#050b20"
  );

  sky.addColorStop(
    .45,
    "#142455"
  );

  sky.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle = sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* MOON */

  ctx.beginPath();

  ctx.arc(
    W*.5,
    H*.17,
    Math.min(W,H)*.075,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "rgba(160,110,255,.18)";

  ctx.fill();


  /* DISTANT TREES */

  for(
    let i=0;
    i<15;
    i++
  ){

    const x =
      (i/14)*W;

    const h =
      30+(i%4)*16;

    ctx.fillStyle =
      "#071326";

    ctx.beginPath();

    ctx.moveTo(
      x,
      H*.44
    );

    ctx.lineTo(
      x-35,
      H*.44
    );

    ctx.lineTo(
      x,
      H*.44-h
    );

    ctx.lineTo(
      x+35,
      H*.44
    );

    ctx.closePath();

    ctx.fill();

  }

}


/* =====================================================
   ROAD
===================================================== */

function drawRoad(){

  const horizon =
    H*.42;

  const bottom =
    H;


  /* GRASS */

  ctx.fillStyle =
    "#062d1b";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );


  /* ROAD */

  ctx.beginPath();

  ctx.moveTo(
    W*.39,
    horizon
  );

  ctx.lineTo(
    W*.61,
    horizon
  );

  ctx.lineTo(
    W*.94,
    bottom
  );

  ctx.lineTo(
    W*.06,
    bottom
  );

  ctx.closePath();

  ctx.fillStyle =
    "#12121c";

  ctx.fill();


  /* ROAD GLOW */

  ctx.strokeStyle =
    "rgba(130,80,255,.35)";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    W*.39,
    horizon
  );

  ctx.lineTo(
    W*.06,
    bottom
  );

  ctx.moveTo(
    W*.61,
    horizon
  );

  ctx.lineTo(
    W*.94,
    bottom
  );

  ctx.stroke();


  /* LANE LINES */

  const spacing = 95;

  const offset =
    worldOffset % spacing;

  for(
    let i=-2;
    i<12;
    i++
  ){

    const y =
      horizon+
      i*spacing+
      offset;

    if(y<horizon || y>H)
      continue;

    const p =
      (y-horizon)/
      (H-horizon);

    const left =
      W*(
        .39+
        (.06-.39)*p
      );

    const mid =
      W*.5;

    const right =
      W*(
        .61+
        (.94-.61)*p
      );

    ctx.strokeStyle =
      "rgba(220,210,255,.55)";

    ctx.lineWidth =
      Math.max(
        2,
        p*5
      );


    ctx.beginPath();

    ctx.moveTo(
      left+(mid-left)*.5,
      y
    );

    ctx.lineTo(
      left+(mid-left)*.75,
      y
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      mid+(right-mid)*.25,
      y
    );

    ctx.lineTo(
      mid+(right-mid)*.5,
      y
    );

    ctx.stroke();

  }


  /* ROAD SPEED MARKS */

  for(
    let i=0;
    i<12;
    i++
  ){

    const y =
      horizon+
      (
        (
          i*130+
          worldOffset*1.5
        ) %
        (H-horizon+130)
      );

    const p =
      (y-horizon)/
      (H-horizon);

    if(
      p<0 ||
      p>1
    )
      continue;

    const width =
      8+p*35;

    ctx.fillStyle =
      "rgba(255,255,255,.08)";

    ctx.fillRect(
      W*.5-width/2,
      y,
      width,
      3+p*5
    );

  }

}


/* =====================================================
   LANE POSITION
===================================================== */

function laneX(
  lane,
  p
){

  const horizonY =
    H*.42;

  const bottomY =
    H*.92;

  const y =
    horizonY+
    p*(bottomY-horizonY);

  const left =
    W*.39+
    p*(W*.06-W*.39);

  const right =
    W*.61+
    p*(W*.94-W*.61);


  if(lane===0)

    return left+
      (right-left)*.16;


  if(lane===1)

    return left+
      (right-left)*.50;


  return left+
    (right-left)*.84;

}


/* =====================================================
   COIN
===================================================== */

function drawCoin(
  x,
  y,
  size
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  const spin =
    Math.sin(
      worldOffset*.04
    );

  ctx.scale(
    Math.max(
      .18,
      Math.abs(spin)
    ),
    1
  );

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    size,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ffd21c";

  ctx.fill();

  ctx.lineWidth = 3;

  ctx.strokeStyle =
    "#fff4a0";

  ctx.stroke();

  ctx.fillStyle =
    "#fff4a0";

  ctx.font =
    size*.9+
    "px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    "$",
    0,
    1
  );

  ctx.restore();

}


/* =====================================================
   OBSTACLE
===================================================== */

function drawObstacle(
  x,
  y,
  scale,
  type
){

  const w =
    65*scale;

  const h =
    type==="barrier"
    ? 32*scale
    : 70*scale;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.fillStyle =
    "#242433";

  ctx.strokeStyle =
    "#ff3b6b";

  ctx.lineWidth =
    Math.max(
      2,
      3*scale
    );


  if(type==="barrier"){

    ctx.fillStyle =
      "#ff304f";

    ctx.fillRect(
      -w,
      -h,
      w*2,
      h
    );

    ctx.fillStyle =
      "#ffe34b";

    for(
      let i=-w;
      i<w;
      i+=22*scale
    ){

      ctx.beginPath();

      ctx.moveTo(
        i,
        -h
      );

      ctx.lineTo(
        i+14*scale,
        -h
      );

      ctx.lineTo(
        i-3*scale,
        0
      );

      ctx.lineTo(
        i-17*scale,
        0
      );

      ctx.closePath();

      ctx.fill();

    }

    ctx.strokeRect(
      -w,
      -h,
      w*2,
      h
    );

  }else{

    roundRect(
      ctx,
      -w*.55,
      -h,
      w*1.1,
      h,
      9*scale
    );

    ctx.fill();

    ctx.stroke();

    ctx.fillStyle =
      "#ff315f";

    ctx.font =
      30*scale+
      "px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "!",
      0,
      -h*.42
    );

  }

  ctx.restore();

}


/* =====================================================
   POWER
===================================================== */

function drawPower(
  x,
  y,
  size,
  type
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    size,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#653dff";

  ctx.shadowBlur = 22;

  ctx.shadowColor =
    "#8d5cff";

  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle =
    "white";

  ctx.font =
    size+
    "px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    type==="speed"
      ? "⚡"
      : type==="shield"
      ? "🛡"
      : "🪙",
    0,
    1
  );

  ctx.restore();

}


/* =====================================================
   ROUND RECT
===================================================== */

function roundRect(
  c,
  x,
  y,
  w,
  h,
  r
){

  c.beginPath();

  c.moveTo(
    x+r,
    y
  );

  c.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    r
  );

  c.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    r
  );

  c.arcTo(
    x,
    y+h,
    x,
    y,
    r
  );

  c.arcTo(
    x,
    y,
    x+w,
    y,
    r
  );

  c.closePath();

}

/* =====================================================
   OBJECT DRAW
===================================================== */

function drawObjects(){

  const sorted =
    [...objects]
      .sort(
        (a,b)=>
          b.z-a.z
      );


  sorted.forEach(o=>{

    if(
      o.z<0 ||
      o.z>1.2
    )
      return;


    const p =
      o.z;


    const x =
      laneX(
        o.lane,
        p
      );


    const horizon =
      H*.42;


    const y =
      horizon+
      p*
      (H*.84-horizon);


    const scale =
      .25+
      p*1.25;


    if(o.type==="coin"){

      drawCoin(
        x,
        y-30*scale,
        13*scale
      );

    }

    else if(
      o.type==="block" ||
      o.type==="barrier"
    ){

      drawObstacle(
        x,
        y,
        scale,
        o.type
      );

    }

    else if(
      o.type==="power"
    ){

      drawPower(
        x,
        y-35*scale,
        19*scale,
        o.powerType
      );

    }

  });

}


/* =====================================================
   COLLISION
===================================================== */

function collision(o){

  if(
    o.lane !==
    Math.round(playerX)
  )
    return false;


  return (
    o.z>.86 &&
    o.z<1.08
  );

}


/* =====================================================
   HANDLE COLLISION
===================================================== */

function handle(o){

  if(o.collected)
    return;


  o.collected = true;


  if(
    o.type==="coin"
  ){

    runCoins +=
      powerMode==="coins"
      ? 2
      : 1;

    score +=
      25*multiplier;

    return;

  }


  if(
    o.type==="power"
  ){

    activatePower(
      o.powerType
    );

    powerCount++;

    return;

  }


  if(
    o.type==="block"
  ){

    if(
      jumping ||
      powerMode==="shield"
    ){

      if(
        powerMode==="shield"
      ){

        message(
          "🛡 SHIELD BLOCKED!"
        );

      }

      return;

    }

    endGame();

    return;

  }


  if(
    o.type==="barrier"
  ){

    if(
      jumping ||
      powerMode==="shield"
    ){

      if(
        powerMode==="shield"
      ){

        message(
          "🛡 SHIELD BLOCKED!"
        );

      }

      return;

    }

    endGame();

  }

}


/* =====================================================
   POWER
===================================================== */

function activatePower(type){

  powerMode =
    type;

  powerTime =
    type==="speed"
      ? 5000
      : 6000;


  if(type==="speed")

    message(
      "⚡ SHADOW SPEED!"
    );


  if(type==="shield")

    message(
      "🛡 SHADOW SHIELD!"
    );


  if(type==="coins")

    message(
      "🪙 COIN BOOST!"
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function message(text){

  const el =
    document.getElementById(
      "powerMessage"
    );


  el.textContent =
    text;


  el.style.opacity =
    "1";


  clearTimeout(
    message.timer
  );


  message.timer =
    setTimeout(
      ()=>{
        el.style.opacity="0";
      },
      1200
    );

}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  /*
    CHARACTER LANE MOVEMENT
  */

  playerX +=
    (
      targetLane-playerX
    )*
    Math.min(
      1,
      dt*.014
    );


  /*
    RUNNING ANIMATION
  */

  worldOffset +=
    speed*dt;


  /*
    SCORE
  */

  score +=
    dt*
    .025*
    multiplier;


  /*
    MULTIPLIER
  */

  multiplier =
    Math.min(
      10,
      1+
      Math.floor(
        score/1000
      )
    );


  /*
    SPEED
  */

  speed +=
    dt*.000006;


  /*
    JUMP
  */

  if(jumping){

    jumpTime -= dt;

    if(
      jumpTime<=0
    ){

      jumping=false;

    }

  }


  /*
    SLIDE
  */

  if(sliding){

    slideTime -= dt;

    if(
      slideTime<=0
    ){

      sliding=false;

    }

  }


  /*
    POWER
  */

  if(powerMode){

    powerTime -= dt;

    if(
      powerTime<=0
    ){

      powerMode="";

    }

  }


  /*
    SPAWN
  */

  spawnTime -= dt;


  if(
    spawnTime<=0
  ){

    if(
      Math.random()<.48
    )

      spawnCoins();

    else

      spawnObstacle();


    spawnTime =
      Math.max(
        470,
        900-
        speed*150
      );

  }


  /*
    POWER SPAWN
  */

  powerSpawn -= dt;


  if(
    powerSpawn<=0
  ){

    if(
      Math.random()<.7
    )

      spawnPower();


    powerSpawn =
      5000+
      Math.random()*3500;

  }


  /*
    OBJECTS
  */

  objects.forEach(o=>{

    o.z +=
      speed*
      dt*
      .00062;


    if(
      collision(o)
    ){

      handle(o);

    }

  });


  objects =
    objects.filter(
      o=>
        !o.collected &&
        o.z<1.18
    );


  updateUI();

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawBackground();

  drawRoad();

  drawObjects();

  drawPlayer();

}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(!running)
    return;


  const dt =
    Math.min(
      40,
      time-lastTime
    );


  lastTime =
    time;


  update(dt);

  draw();


  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

  document.getElementById(
    "score"
  ).textContent =
    Math.floor(
      score
    ).toLocaleString();


  document.getElementById(
    "multiplier"
  ).textContent =
    "x"+
    multiplier;


  document.getElementById(
    "coins"
  ).textContent =
    (
      save.coins+
      runCoins
    ).toLocaleString();

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

  if(!running)
    return;


  running=false;


  const final =
    Math.floor(score);


  save.coins +=
    runCoins;


  if(
    final>save.best
  ){

    save.best =
      final;

  }


  saveGame();


  document.getElementById(
    "finalScore"
  ).textContent =
    "SCORE: "+
    final.toLocaleString();


  document.getElementById(
    "finalCoins"
  ).textContent =
    runCoins.toLocaleString();


  document.getElementById(
    "finalBest"
  ).textContent =
    save.best.toLocaleString();


  updateMissions();

  screen("gameOver");

}


/* =====================================================
   MISSIONS
===================================================== */

function updateMissions(){

  document.getElementById(
    "mCoins"
  ).textContent =
    Math.min(
      runCoins,
      25
    )+
    " / 25";


  document.getElementById(
    "mScore"
  ).textContent =
    Math.min(
      Math.floor(score),
      2000
    )+
    " / 2000";


  document.getElementById(
    "mPower"
  ).textContent =
    Math.min(
      powerCount,
      3
    )+
    " / 3";

}

   MENU BUTTONS
===================================================== */

document
  .getElementById("start")
  .onclick =
  startGame;


document
  .getElementById("retry")
  .onclick =

document
  .getElementById("home")

document
  .getElementById("missions")
  .onclick =

    updateMissions();

    screen(

    );

  };


document
  .getElementById("back")
  .onclick =
  ()=>{

    updateMenu();

    screen("menu");

  };


document
  .getElementById("reset")
  .onclick =
  ()=>{

    if(
      !confirm(

      )
    )
      return;


    localStorage.removeItem(
      SAVE_KEY
    );


    save={
      coins:0,
      best:0
    };


    updateMenu();

  };


/* =====================================================
   INITIALIZE
===================================================== */

loadSave();

updateMenu();

</script>
