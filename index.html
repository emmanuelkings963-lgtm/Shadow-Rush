<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Shadow Rush</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03030a;
  font-family:Arial,sans-serif;
  color:white;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#050510;
}

#hud{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:94%;
  max-width:500px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  pointer-events:none;
}

.hudBox{
  padding:8px 11px;
  border:2px solid #00eaff;
  border-radius:10px;
  background:rgba(0,0,0,.7);
  color:#00eaff;
  font-weight:bold;
  text-shadow:0 0 8px #00eaff;
}

#menu,
#gameOver{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,
    #101040 0%,
    #050510 45%,
    #010105 100%);
}

.box{
  width:92%;
  max-width:420px;
  padding:25px;
  border:2px solid #00eaff;
  border-radius:20px;
  background:rgba(7,7,20,.95);
  box-shadow:
    0 0 30px #0066ff,
    inset 0 0 20px rgba(0,170,255,.15);
  text-align:center;
}

h1{
  color:#00eaff;
  text-shadow:0 0 18px #008cff;
}

h2{
  color:#b9f8ff;
}

button{
  padding:12px 18px;
  margin:6px;
  border:2px solid #00aaff;
  border-radius:10px;
  background:#07071b;
  color:#00eaff;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

button:active{
  transform:scale(.94);
}

.choice{
  border:1px solid #30305a;
  border-radius:12px;
  padding:10px;
  margin:10px 0;
}

.selected{
  border-color:#00eaff;
  box-shadow:0 0 15px #0066ff;
}

#controls{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:94%;
  max-width:500px;
  display:flex;
  justify-content:space-between;
  z-index:8;
  pointer-events:none;
}

.control{
  width:72px;
  height:58px;
  margin:0;
  font-size:25px;
  background:rgba(0,0,0,.65);
  pointer-events:auto;
}

#jumpButton{
  width:82px;
}

.hidden{
  display:none!important;
}

#gameOver{
  background:rgba(0,0,0,.88);
}

#gameOver h1{
  color:#ff3355;
  text-shadow:0 0 15px #ff0033;
}

.small{
  color:#aaa;
  font-size:13px;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">

  <div class="hudBox">
    🪙 <span id="coinsText">0</span>
  </div>

  <div class="hudBox">
    🏆 <span id="scoreText">0</span>
  </div>

  <div class="hudBox">
    ⚡ <span id="speedText">1.0</span>
  </div>

</div>


<!-- MAIN MENU -->
<div id="menu">

  <div class="box">

    <h1>🌑 SHADOW RUSH</h1>

    <p>
      🏃 THE ENDLESS RUN BEGINS
    </p>

    <p>
      Coins:
      <strong id="menuCoins">0</strong>
    </p>

    <p>
      Best Score:
      <strong id="menuBest">0</strong>
    </p>

    <div class="choice">

      <strong>🧑 CHARACTER</strong>

      <br>

      <button
        id="rookieBtn"
        onclick="selectCharacter('rookie')">
        Rookie
      </button>

      <button
        id="blazeBtn"
        onclick="selectCharacter('blaze')">
        Blaze
      </button>

      <button
        id="shadowBtn"
        onclick="selectCharacter('shadow')">
        Shadow
      </button>

    </div>


    <div class="choice">

      <strong>🛼 MOVEMENT</strong>

      <br>

      <button
        id="footBtn"
        onclick="selectMovement('foot')">
        🏃 Foot
      </button>

      <button
        id="skateBtn"
        onclick="selectMovement('skate')">
        🛼 Skates
      </button>

    </div>


    <p id="selectionText">
      🧑 Rookie + 🏃 Foot
    </p>

    <button onclick="startGame()">
      ▶️ START RUN
    </button>

    <p class="small">
      Swipe left/right to change lanes.<br>
      Swipe up to jump.
    </p>

  </div>

</div>


<!-- CONTROLS -->
<div id="controls">

  <button
    class="control"
    onclick="moveLeft()">
    ◀
  </button>

  <button
    id="jumpButton"
    class="control"
    onclick="jump()">
    ⬆
  </button>

  <button
    class="control"
    onclick="moveRight()">
    ▶
  </button>

</div>


<!-- GAME OVER -->
<div id="gameOver" class="hidden">

  <div class="box">

    <h1>💀 RUN OVER</h1>

    <p>
      Score:
      <strong id="finalScore">0</strong>
    </p>

    <p>
      Coins:
      <strong id="finalCoins">0</strong>
    </p>

    <p>
      Best Score:
      <strong id="finalBest">0</strong>
    </p>

    <button onclick="restartGame()">
      🔄 RUN AGAIN
    </button>

    <button onclick="returnMenu()">
      🏠 MENU
    </button>

  </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;

function resizeCanvas(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width =
    W * dpr;

  canvas.height =
    H * dpr;

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/* =====================================================
   SAVE
===================================================== */

const SAVE_KEY =
  "shadowRushSave_v1";

let save = {

  coins:0,

  bestScore:0

};

try{

  const stored =
    localStorage.getItem(
      SAVE_KEY
    );

  if(stored){

    save =
      {
        ...save,
        ...JSON.parse(stored)
      };

  }

}catch(e){

  console.log(e);

}


function saveGame(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(save)
    );

  }catch(e){

    console.log(e);

  }

}


/* =====================================================
   PLAYER SETTINGS
===================================================== */

let selectedCharacter =
  "rookie";

let movement =
  "foot";


function selectCharacter(type){

  selectedCharacter =
    type;

  updateSelection();

}


function selectMovement(type){

  movement =
    type;

  updateSelection();

}


function updateSelection(){

  document
    .querySelectorAll(".choice button")
    .forEach(
      button =>
        button.classList.remove(
          "selected"
        )
    );

  document
    .getElementById(
      selectedCharacter + "Btn"
    )
    .classList.add(
      "selected"
    );

  document
    .getElementById(
      movement === "foot"
        ? "footBtn"
        : "skateBtn"
    )
    .classList.add(
      "selected"
    );


  const names = {

    rookie:"Rookie",

    blaze:"Blaze",

    shadow:"Shadow"

  };

  document.getElementById(
    "selectionText"
  ).innerText =

    "🧑 " +
    names[selectedCharacter] +

    " + " +

    (
      movement === "foot"
        ? "🏃 Foot"
        : "🛼 Skates"
    );

}


updateSelection();


/* =====================================================
   GAME STATE
===================================================== */

let running =
  false;

let gameOver =
  false;

let animationId =
  null;

let score =
  0;

let runCoins =
  0;

let speed =
  7;

let distance =
  0;

let spawnTimer =
  0;

let coinTimer =
  0;

let roadOffset =
  0;


/* =====================================================
   PLAYER
===================================================== */

const player = {

  lane:1,

  targetLane:1,

  x:0,

  y:0,

  width:42,

  height:70,

  jumpY:0,

  jumpVelocity:0,

  grounded:true,

  laneMoveSpeed:0.25

};


/* =====================================================
   OBJECTS
===================================================== */

let obstacles = [];

let coins = [];


/* =====================================================
   ROAD
===================================================== */

function roadTop(){

  return H * 0.38;

}

function roadBottom(){

  return H;

}

function laneX(
  lane,
  y
){

  const topWidth =
    Math.min(
      W * .55,
      330
    );

  const bottomWidth =
    Math.min(
      W * .95,
      560
    );

  const t =
    Math.max(
      0,
      Math.min(
        1,
        (y - roadTop()) /
        (H - roadTop())
      )
    );

  const width =
    topWidth +
    (bottomWidth-topWidth)*t;

  const left =
    (W-width)/2;

  return (
    left +
    width *
    ((lane + .5)/3)
  );

}


/* =====================================================
   START
===================================================== */

function startGame(){

  document
    .getElementById("menu")
    .classList.add("hidden");

  document
    .getElementById("gameOver")
    .classList.add("hidden");

  score = 0;

  runCoins = 0;

  speed =
    movement === "skate"
      ? 8
      : 7;

  distance = 0;

  spawnTimer = 0;

  coinTimer = 0;

  roadOffset = 0;

  obstacles = [];

  coins = [];

  player.lane = 1;

  player.targetLane = 1;

  player.jumpY = 0;

  player.jumpVelocity = 0;

  player.grounded = true;

  player.x =
    laneX(
      1,
      H*.78
    );

  running = true;

  gameOver = false;

  updateHUD();

  cancelAnimationFrame(
    animationId
  );

  animationId =
    requestAnimationFrame(
      gameLoop
    );

}


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

  startGame();

}


/* =====================================================
   RETURN MENU
===================================================== */

function returnMenu(){

  running = false;

  gameOver = false;

  document
    .getElementById("gameOver")
    .classList.add("hidden");

  document
    .getElementById("menu")
    .classList.remove("hidden");

  updateMenu();

}


/* =====================================================
   LANE MOVEMENT
===================================================== */

function moveLeft(){

  if(!running) return;

  if(
    player.targetLane > 0
  ){

    player.targetLane--;

  }

}


function moveRight(){

  if(!running) return;

  if(
    player.targetLane < 2
  ){

    player.targetLane++;

  }

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

  if(
    !running ||
    !player.grounded
  ){

    return;

  }

  player.grounded =
    false;

  player.jumpVelocity =
    movement === "skate"
      ? 17
      : 16;

}


/* =====================================================
   INPUT
===================================================== */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener(
  "touchstart",
  function(e){

    const touch =
      e.touches[0];

    touchStartX =
      touch.clientX;

    touchStartY =
      touch.clientY;

  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  function(e){

    if(!running) return;

    const touch =
      e.changedTouches[0];

    const dx =
      touch.clientX -
      touchStartX;

    const dy =
      touch.clientY -
      touchStartY;

    const minSwipe =
      35;

    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      if(
        Math.abs(dx) >
        minSwipe
      ){

        if(dx > 0)
          moveRight();
        else
          moveLeft();

      }

    }else{

      if(
        dy < -minSwipe
      ){

        jump();

      }

    }

  },
  {passive:true}
);


document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "ArrowLeft")
      moveLeft();

    if(e.key === "ArrowRight")
      moveRight();

    if(
      e.key === "ArrowUp" ||
      e.key === " "
    ){

      jump();

    }

  }
);


/* =====================================================
   SPAWN OBSTACLE
===================================================== */

function spawnObstacle(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  obstacles.push({

    lane:lane,

    z:0,

    type:
      Math.random() < .5
        ? "barrier"
        : "block"

  });

}


/* =====================================================
   SPAWN COINS
===================================================== */

function spawnCoinLine(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  const amount =
    4 +
    Math.floor(
      Math.random()*4
    );

  for(
    let i=0;
    i<amount;
    i++
  ){

    coins.push({

      lane:lane,

      z:
        -i * 75

    });

  }

}


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime = 0;

function gameLoop(time){

  if(!running)
    return;

  const delta =
    Math.min(
      (time-lastTime)/16.67,
      2
    );

  lastTime =
    time;

  update(delta);

  draw();

  animationId =
    requestAnimationFrame(
      gameLoop
    );

}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  distance +=
    speed * dt;

  score =
    Math.floor(
      distance / 10
    );


  /*
    Speed gradually increases.
  */

  speed +=
    0.0015 * dt;

  if(
    speed > 18
  ){

    speed = 18;

  }


  roadOffset +=
    speed * dt;


  /*
    Lane movement.
  */

  const targetX =
    laneX(
      player.targetLane,
      H*.78
    );

  player.x +=
    (
      targetX -
      player.x
    ) *
    player.laneMoveSpeed *
    dt;


  /*
    Jump physics.
  */

  if(!player.grounded){

    player.jumpY +=
      player.jumpVelocity *
      dt;

    player.jumpVelocity -=
      .85 * dt;

    if(
      player.jumpY <= 0
    ){

      player.jumpY = 0;

      player.jumpVelocity = 0;

      player.grounded = true;

    }

  }


  /*
    Spawn obstacles.
  */

  spawnTimer += dt;

  const spawnRate =
    Math.max(
      28,
      65 -
      speed*2
    );

  if(
    spawnTimer >
    spawnRate
  ){

    spawnObstacle();

    spawnTimer = 0;

  }


  /*
    Spawn coins.
  */

  coinTimer += dt;

  if(
    coinTimer > 80
  ){

    spawnCoinLine();

    coinTimer = 0;

  }


  /*
    Move obstacles.
  */

  obstacles.forEach(
    obstacle => {

      obstacle.z +=
        speed * dt;

    }
  );


  /*
    Move coins.
  */

  coins.forEach(
    coin => {

      coin.z +=
        speed * dt;

    }
  );


  checkCollisions();


  /*
    Remove objects
    after passing player.
  */

  obstacles =
    obstacles.filter(
      obstacle =>
        obstacle.z < 115
    );

  coins =
    coins.filter(
      coin =>
        coin.z < 115
    );


  updateHUD();

}


/* =====================================================
   COLLISION
===================================================== */

function checkCollisions(){

  /*
    Player is near z = 90.
  */

  const playerZ = 90;


  for(
    const obstacle of obstacles
  ){

    if(
      Math.abs(
        obstacle.z -
        playerZ
      ) < 8 &&

      obstacle.lane ===
      player.targetLane
    ){

      /*
        Jumping avoids
        normal obstacles.
      */

      if(
        player.jumpY < 35
      ){

        endGame();

        return;

      }

    }

  }


  /*
    Coins.
  */

  for(
    const coin of coins
  ){

    if(
      !coin.collected &&

      Math.abs(
        coin.z -
        playerZ
      ) < 10 &&

      coin.lane ===
      player.targetLane
    ){

      /*
        Coins can be collected
        while jumping too.
      */

      coin.collected = true;

      runCoins++;

      save.coins++;

      saveGame();

    }

  }

}


/* =====================================================
   END GAME
===================================================== */

function endGame(){

  running = false;

  gameOver = true;

  if(
    score >
    save.bestScore
  ){

    save.bestScore =
      score;

  }

  saveGame();

  document.getElementById(
    "finalScore"
  ).innerText =
    score;

  document.getElementById(
    "finalCoins"
  ).innerText =
    runCoins;

  document.getElementById(
    "finalBest"
  ).innerText =
    save.bestScore;

  document
    .getElementById("gameOver")
    .classList.remove("hidden");

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById(
    "coinsText"
  ).innerText =
    runCoins;

  document.getElementById(
    "scoreText"
  ).innerText =
    score;

  document.getElementById(
    "speedText"
  ).innerText =
    (
      speed / 7
    ).toFixed(1);

}


function updateMenu(){

  document.getElementById(
    "menuCoins"
  ).innerText =
    save.coins;

  document.getElementById(
    "menuBest"
  ).innerText =
    save.bestScore;

}


updateMenu();


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Sky.
  */

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  sky.addColorStop(
    0,
    "#05051c"
  );

  sky.addColorStop(
    .45,
    "#101040"
  );

  sky.addColorStop(
    1,
    "#020208"
  );

  ctx.fillStyle =
    sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  drawMoon();

  drawBuildings();

  drawRoad();

  drawObjects();

  drawPlayer();

}


/* =====================================================
   MOON
===================================================== */

function drawMoon(){

  ctx.beginPath();

  ctx.arc(
    W*.75,
    H*.14,
    35,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#d9f5ff";

  ctx.shadowBlur =
    30;

  ctx.shadowColor =
    "#00eaff";

  ctx.fill();

  ctx.shadowBlur =
    0;

}


/* =====================================================
   BUILDINGS
===================================================== */

function drawBuildings(){

  const base =
    roadTop();

  ctx.fillStyle =
    "#080817";

  for(
    let i=0;
    i<10;
    i++
  ){

    const width =
      45 +
      (i%3)*25;

    const height =
      70 +
      (i%4)*45;

    const x =
      i*65 -
      (roadOffset*.15 %
       (W+100));

    ctx.fillRect(
      x,
      base-height,
      width,
      height
    );

  }

}


/* =====================================================
   ROAD
===================================================== */

function drawRoad(){

  const top =
    roadTop();

  const bottom =
    H;

  const topWidth =
    Math.min(
      W*.55,
      330
    );

  const bottomWidth =
    Math.min(
      W*.95,
      560
    );


  ctx.beginPath();

  ctx.moveTo(
    (W-topWidth)/2,
    top
  );

  ctx.lineTo(
    (W+topWidth)/2,
    top
  );

  ctx.lineTo(
    (W+bottomWidth)/2,
    bottom
  );

  ctx.lineTo(
    (W-bottomWidth)/2,
    bottom
  );

  ctx.closePath();

  ctx.fillStyle =
    "#141421";

  ctx.fill();


  /*
    Road edges.
  */

  ctx.strokeStyle =
    "#00aaff";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    (W-topWidth)/2,
    top
  );

  ctx.lineTo(
    (W-bottomWidth)/2,
    bottom
  );

  ctx.moveTo(
    (W+topWidth)/2,
    top
  );

  ctx.lineTo(
    (W+bottomWidth)/2,
    bottom
  );

  ctx.stroke();


  /*
    Lane markings.
  */

  for(
    let lane = 1;
    lane <= 2;
    lane++
  ){

    for(
      let i=0;
      i<12;
      i++
    ){

      let y =
        top +
        (
          (
            i*100 +
            roadOffset*3
          ) %
          (H-top+100)
        );

      const t =
        (y-top) /
        (H-top);

      const topX =
        W/2 +
        (lane-1.5) *
        topWidth/3;

      const bottomX =
        W/2 +
        (lane-1.5) *
        bottomWidth/3;

      const x =
        topX +
        (bottomX-topX)*t;

      const size =
        5 +
        18*t;

      ctx.fillStyle =
        "rgba(0,180,255,.65)";

      ctx.fillRect(
        x-size/2,
        y,
        size,
        5+12*t
      );

    }

  }

}


/* =====================================================
   DRAW OBJECTS
===================================================== */

function objectPosition(
  lane,
  z
){

  /*
    z:
    0 = horizon
    100 = player
  */

  const t =
    Math.max(
      0,
      Math.min(
        1,
        z/100
      )
    );

  const y =
    roadTop() +
    (
      H-roadTop()
    ) * t;

  return {

    x:
      laneX(
        lane,
        y
      ),

    y:y,

    scale:
      .25 +
      t*.9

  };

}


/* =====================================================
   OBSTACLES
===================================================== */

function drawObjects(){

  obstacles.forEach(
    obstacle => {

      const p =
        objectPosition(
          obstacle.lane,
          obstacle.z
        );

      const width =
        45*p.scale;

      const height =
        45*p.scale;

      ctx.save();

      ctx.translate(
        p.x,
        p.y
      );

      if(
        obstacle.type ===
        "barrier"
      ){

        ctx.fillStyle =
          "#ff3344";

        ctx.fillRect(
          -width/2,
          -height,
          width,
          height
        );

        ctx.fillStyle =
          "#111";

        ctx.fillRect(
          -width/2,
          -height*.75,
          width,
          height*.15
        );

        ctx.fillRect(
          -width/2,
          -height*.35,
          width,
          height*.15
        );

      }else{

        ctx.fillStyle =
          "#7733ff";

        ctx.shadowBlur =
          15;

        ctx.shadowColor =
          "#aa44ff";

        ctx.fillRect(
          -width/2,
          -height,
          width,
          height
        );

        ctx.shadowBlur =
          0;

      }

      ctx.restore();

    }
  );


  /*
    Coins.
  */

  coins.forEach(
    coin => {

      if(
        coin.collected
      )
        return;

      const p =
        objectPosition(
          coin.lane,
          coin.z
        );

      const radius =
        9*p.scale;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y-heightOffset(),
        radius,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        "#ffd700";

      ctx.shadowBlur =
        15;

      ctx.shadowColor =
        "#ffcc00";

      ctx.fill();

      ctx.shadowBlur =
        0;

    }
  );

}


function heightOffset(){

  return 20;

}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

  const groundY =
    H*.82;

  const y =
    groundY -
    player.jumpY;


  ctx.save();

  ctx.translate(
    player.x,
    y
  );


  /*
    Shadow underneath player.
  */

  ctx.beginPath();

  ctx.ellipse(
    0,
    4,
    25,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "rgba(0,0,0,.5)";

  ctx.fill();


  /*
    Character colors.
  */

  let bodyColor =
    "#00aaff";

  if(
    selectedCharacter ===
    "blaze"
  ){

    bodyColor =
      "#ff5533";

  }

  if(
    selectedCharacter ===
    "shadow"
  ){

    bodyColor =
      "#9922ff";

  }


  /*
    Head.
  */

  ctx.beginPath();

  ctx.arc(
    0,
    -55,
    13,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#e6c2a5";

  ctx.fill();


  /*
    Hair.
  */

  ctx.beginPath();

  ctx.arc(
    0,
    -59,
    14,
    Math.PI,
    Math.PI*2
  );

  ctx.fillStyle =
    "#111";

  ctx.fill();


  /*
    Body.
  */

  ctx.fillStyle =
    bodyColor;

  ctx.fillRect(
    -13,
    -42,
    26,
    32
  );


  /*
    Arms.
  */

  ctx.strokeStyle =
    bodyColor;

  ctx.lineWidth =
    7;

  ctx.beginPath();

  ctx.moveTo(
    -12,
    -37
  );

  ctx.lineTo(
    -25,
    -18
  );

  ctx.moveTo(
    12,
    -37
  );

  ctx.lineTo(
    25,
    -18
  );

  ctx.stroke();


  /*
    Legs.
  */

  ctx.strokeStyle =
    "#202030";

  ctx.lineWidth =
    9;

  ctx.beginPath();

  ctx.moveTo(
    -7,
    -10
  );

  ctx.lineTo(
    -12,
    12
  );

  ctx.moveTo(
    7,
    -10
  );

  ctx.lineTo(
    12,
    12
  );

  ctx.stroke();


  /*
    Skates.
  */

  if(
    movement ===
    "skate"
  ){

    ctx.fillStyle =
      "#00eaff";

    ctx.fillRect(
      -20,
      9,
      15,
      5
    );

    ctx.fillRect(
      5,
      9,
      15,
      5
    );

    ctx.fillStyle =
      "#222";

    ctx.beginPath();

    ctx.arc(
      -15,
      16,
      4,
      0,
      Math.PI*2
    );

    ctx.arc(
      15,
      16,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /*
    Shadow aura.
  */

  if(
    selectedCharacter ===
    "shadow"
  ){

    ctx.beginPath();

    ctx.arc(
      0,
      -30,
      35,
      0,
      Math.PI*2
    );

    ctx.strokeStyle =
      "rgba(150,50,255,.45)";

    ctx.lineWidth =
      3;

    ctx.stroke();

  }


  ctx.restore();

}


/* =====================================================
   PREVENT SCROLLING
===================================================== */

document.addEventListener(
  "touchmove",
  function(e){

    if(running){

      e.preventDefault();

    }

  },
  {passive:false}
);

</script>
