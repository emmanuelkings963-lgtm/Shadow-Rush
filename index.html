<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Shadow Rush</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020208;
  color:white;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  display:block;
}

#hud{
  position:absolute;
  z-index:20;
  top:10px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:5px;
  pointer-events:none;
}

.hudBox{
  flex:1;
  padding:7px 5px;
  border:1px solid #914cff;
  border-radius:12px;
  background:rgba(5,3,18,.84);
  box-shadow:0 0 14px rgba(130,55,255,.35);
  text-align:center;
}

.hudLabel{
  color:#aaa;
  font-size:8px;
}

.hudValue{
  font-size:15px;
  font-weight:900;
}

#power{
  position:absolute;
  z-index:25;
  top:88px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 15px;
  border:1px solid #a65cff;
  border-radius:20px;
  background:rgba(10,5,25,.9);
  color:#e4caff;
  font-weight:bold;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap;
}

#swipeHint{
  position:absolute;
  z-index:15;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.38);
  font-size:11px;
  letter-spacing:2px;
  pointer-events:none;
}

.screen{
  position:absolute;
  z-index:100;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(100,35,210,.3),
      rgba(0,0,0,.95) 72%
    );
}

.hidden{
  display:none!important;
}

.panel{
  width:100%;
  max-width:390px;
  max-height:90vh;
  overflow:auto;
  padding:28px 20px;
  border:2px solid #7e3cff;
  border-radius:24px;
  background:rgba(7,5,20,.97);
  box-shadow:
    0 0 25px rgba(115,45,255,.35),
    0 0 70px rgba(70,20,180,.2);
  text-align:center;
}

.logo{
  font-size:38px;
  font-weight:1000;
  letter-spacing:2px;
  color:#d09aff;
  text-shadow:
    0 0 8px #792cff,
    0 0 28px #792cff;
}

.sub{
  margin:8px 0 24px;
  color:#aaa;
  letter-spacing:3px;
  font-size:10px;
}

.menuBtn{
  width:90%;
  margin:9px auto;
  display:block;
  padding:14px;
  border:2px solid #793cff;
  border-radius:13px;
  background:#0e0820;
  color:#e4d0ff;
  font-size:16px;
  font-weight:bold;
}

.menuBtn:active{
  transform:scale(.96);
  background:#1b0d39;
}

.stat{
  margin:11px 0;
  padding:12px;
  border:1px solid #422080;
  border-radius:12px;
  background:rgba(20,10,40,.5);
}

.mission{
  text-align:left;
  padding:13px;
  margin:10px 0;
  border:1px solid #4d2691;
  border-radius:12px;
  color:#ddd;
}

.mission.complete{
  border-color:#00d084;
  box-shadow:0 0 12px rgba(0,208,132,.25);
}

#loadingText{
  color:#aaa;
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">

    <div class="hudBox">
      <div class="hudLabel">SCORE</div>
      <div class="hudValue" id="score">0</div>
    </div>

    <div class="hudBox">
      <div class="hudLabel">MULTIPLIER</div>
      <div class="hudValue" id="multiplier">x1</div>
    </div>

    <div class="hudBox">
      <div class="hudLabel">COINS</div>
      <div class="hudValue" id="coins">0</div>
    </div>

  </div>

  <div id="power"></div>

  <div id="swipeHint">
    SWIPE TO MOVE
  </div>


  <!-- LOADING -->

  <div class="screen" id="loading">

    <div class="panel">

      <div class="logo">
        SHADOW RUSH
      </div>

      <div class="sub">
        SYSTEM INITIALIZING
      </div>

      <p id="loadingText">
        Building Shadow World...
      </p>

    </div>

  </div>


  <!-- MAIN MENU -->

  <div class="screen hidden" id="menu">

    <div class="panel">

      <div class="logo">
        SHADOW RUSH
      </div>

      <div class="sub">
        RUN BEYOND YOUR LIMITS
      </div>

      <div class="stat">
        🪙 COINS:
        <b id="menuCoins">0</b>
      </div>

      <div class="stat">
        🏆 BEST:
        <b id="menuBest">0</b>
      </div>

      <button class="menuBtn" id="startBtn">
        ▶ START RUN
      </button>

      <button class="menuBtn" id="missionsBtn">
        🎯 MISSIONS
      </button>

      <button class="menuBtn" id="resetBtn">
        ♻ RESET SAVE
      </button>

    </div>

  </div>


  <!-- MISSIONS -->

  <div class="screen hidden" id="missionsScreen">

    <div class="panel">

      <div class="logo" style="font-size:32px">
        MISSIONS
      </div>

      <div class="mission" id="missionBoxCoins">
        🪙 Collect 25 coins
        <br>
        <span id="missionCoins">0 / 25</span>
      </div>

      <div class="mission" id="missionBoxScore">
        🏃 Reach 2,000 score
        <br>
        <span id="missionScore">0 / 2000</span>
      </div>

      <div class="mission" id="missionBoxPower">
        ⚡ Collect 3 power-ups
        <br>
        <span id="missionPower">0 / 3</span>
      </div>

      <button class="menuBtn" id="backBtn">
        ↩ BACK
      </button>

    </div>

  </div>


  <!-- GAME OVER -->

  <div class="screen hidden" id="gameOver">

    <div class="panel">

      <div class="logo" style="font-size:33px">
        RUN OVER
      </div>

      <div class="stat">
        SCORE:
        <b id="finalScore">0</b>
      </div>

      <div class="stat">
        🪙 RUN COINS:
        <b id="finalCoins">0</b>
      </div>

      <div class="stat">
        🏆 BEST:
        <b id="finalBest">0</b>
      </div>

      <button class="menuBtn" id="retryBtn">
        ▶ RUN AGAIN
      </button>

      <button class="menuBtn" id="homeBtn">
        🏠 MAIN MENU
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

"use strict";


/* =========================================================
   SAVE SYSTEM
========================================================= */

const SAVE_KEY = "shadowRush_complete_v1";

let save = {
  coins:0,
  best:0
};

function loadSave(){

  try{

    const raw =
      localStorage.getItem(SAVE_KEY);

    if(raw){

      const data =
        JSON.parse(raw);

      if(
        typeof data.coins === "number" &&
        Number.isFinite(data.coins)
      ){
        save.coins =
          Math.max(0,Math.floor(data.coins));
      }

      if(
        typeof data.best === "number" &&
        Number.isFinite(data.best)
      ){
        save.best =
          Math.max(0,Math.floor(data.best));
      }

    }

  }catch(error){

    console.log("Save load error:",error);

  }

}

function saveGame(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(save)
    );

  }catch(error){

    console.log("Save error:",error);

  }

}

loadSave();


/* =========================================================
   THREE.JS
========================================================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x02030b);

scene.fog =
  new THREE.Fog(
    0x080617,
    30,
    180
  );


const camera =
  new THREE.PerspectiveCamera(
    62,
    window.innerWidth /
    window.innerHeight,
    .1,
    500
  );

camera.position.set(
  0,
  5.4,
  11
);


const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    1.6
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
  new THREE.HemisphereLight(
    0x7777aa,
    0x08030f,
    1.7
  );

scene.add(ambient);


const moon =
  new THREE.DirectionalLight(
    0xb48cff,
    2.1
  );

moon.position.set(
  -15,
  25,
  12
);

moon.castShadow = true;

scene.add(moon);


/* =========================================================
   WORLD
========================================================= */

const world =
  new THREE.Group();

scene.add(world);


/* =========================================================
   MATERIALS
========================================================= */

const matRoad =
  new THREE.MeshStandardMaterial({
    color:0x10101b,
    roughness:.9
  });

const matRail =
  new THREE.MeshStandardMaterial({
    color:0x48465a,
    metalness:.7,
    roughness:.35
  });

const matGlow =
  new THREE.MeshBasicMaterial({
    color:0xa65cff
  });

const matDark =
  new THREE.MeshStandardMaterial({
    color:0x090812
  });

const matRed =
  new THREE.MeshStandardMaterial({
    color:0x5d0b1f,
    emissive:0x30000d,
    emissiveIntensity:1
  });

const matGold =
  new THREE.MeshStandardMaterial({
    color:0xffcf20,
    emissive:0x8a5500,
    emissiveIntensity:.7,
    metalness:.7,
    roughness:.25
  });

const matPurple =
  new THREE.MeshStandardMaterial({
    color:0x5c20c9,
    emissive:0x230052,
    emissiveIntensity:.8
  });


/* =========================================================
   LANES
========================================================= */

const LANE_WIDTH = 3.15;

function laneX(lane){

  return (
    lane - 1
  ) * LANE_WIDTH;

}


/* =========================================================
   ROAD
========================================================= */

const roadSegments = [];

const ROAD_SEGMENT_LENGTH = 80;
const ROAD_SEGMENTS = 6;

for(
  let i=0;
  i<ROAD_SEGMENTS;
  i++
){

  const segment =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        18,
        ROAD_SEGMENT_LENGTH
      ),
      matRoad
    );

  segment.rotation.x =
    -Math.PI/2;

  segment.position.set(
    0,
    0,
    -i*ROAD_SEGMENT_LENGTH
  );

  world.add(segment);

  roadSegments.push(segment);

}


/* =========================================================
   LANE LINES
========================================================= */

const laneLines = [];

for(
  let i=0;
  i<ROAD_SEGMENTS;
  i++
){

  for(
    const x of [-1.575,1.575]
  ){

    const line =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .055,
          .025,
          ROAD_SEGMENT_LENGTH
        ),
        matGlow
      );

    line.position.set(
      x,
      .035,
      -i*ROAD_SEGMENT_LENGTH
    );

    world.add(line);

    laneLines.push(line);

  }

}


/* =========================================================
   ROAD RAILS
========================================================= */

const rails = [];

for(
  let i=0;
  i<ROAD_SEGMENTS;
  i++
){

  for(
    const x of [-4.7,4.7]
  ){

    const rail =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .12,
          .12,
          ROAD_SEGMENT_LENGTH
        ),
        matRail
      );

    rail.position.set(
      x,
      .08,
      -i*ROAD_SEGMENT_LENGTH
    );

    world.add(rail);

    rails.push(rail);

  }

}


/* =========================================================
   BUILDINGS
========================================================= */

const buildings = [];

function createBuilding(x,z,side){

  const height =
    8 + Math.random()*17;

  const width =
    5 + Math.random()*5;

  const depth =
    8 + Math.random()*8;

  const material =
    new THREE.MeshStandardMaterial({
      color:
        side < 0
        ? 0x10172b
        : 0x161028,
      roughness:.9
    });

  const building =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      material
    );

  building.position.set(
    x,
    height/2,
    z
  );

  world.add(building);

  buildings.push(building);


  /* WINDOWS */

  const rows =
    Math.max(
      3,
      Math.floor(height/2)
    );

  for(
    let row=0;
    row<rows;
    row++
  ){

    const windowMat =
      new THREE.MeshBasicMaterial({
        color:
          Math.random()<.55
          ? 0x6e48ff
          : 0x222239
      });

    const win =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .35,
          .5,
          .04
        ),
        windowMat
      );

    win.position.set(
      x +
      (Math.random()-.5) *
      width*.6,

      1.2 + row*2,

      z +
      (
        side < 0
        ? depth/2+.03
        : -depth/2-.03
      )
    );

    world.add(win);

  }

}


for(
  let i=0;
  i<40;
  i++
){

  const z =
    -20-i*12;

  createBuilding(
    -9-Math.random()*5,
    z,
    -1
  );

  createBuilding(
    9+Math.random()*5,
    z,
    1
  );

}


/* =========================================================
   STREET LIGHTS
========================================================= */

const lamps = [];

function createLamp(x,z){

  const group =
    new THREE.Group();


  const pole =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .06,
        .08,
        4.5,
        8
      ),
      matDark
    );

  pole.position.y =
    2.25;

  group.add(pole);


  const bulb =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .18,
        12,
        12
      ),
      new THREE.MeshBasicMaterial({
        color:0xd8c8ff
      })
    );

  bulb.position.y =
    4.55;

  group.add(bulb);


  const light =
    new THREE.PointLight(
      0x8f55ff,
      1.4,
      10
    );

  light.position.y =
    4.5;

  group.add(light);


  group.position.set(
    x,
    0,
    z
  );

  world.add(group);

  lamps.push(group);

}


for(
  let i=0;
  i<30;
  i++
){

  const z =
    -10-i*17;

  createLamp(-7,z);
  createLamp(7,z);

}


/* =========================================================
   PLAYER
========================================================= */

const player =
  new THREE.Group();

scene.add(player);

player.position.set(
  0,
  0,
  6
);


const skinMat =
  new THREE.MeshStandardMaterial({
    color:0xb9785b
  });

const hairMat =
  new THREE.MeshStandardMaterial({
    color:0x05050a
  });

const jacketMat =
  new THREE.MeshStandardMaterial({
    color:0x32106d,
    emissive:0x16002e,
    emissiveIntensity:.7
  });

const jacketEdgeMat =
  new THREE.MeshStandardMaterial({
    color:0x8e4cff,
    emissive:0x351080,
    emissiveIntensity:.9
  });

const shoeMat =
  new THREE.MeshStandardMaterial({
    color:0x050508
  });


function box(
  x,
  y,
  z,
  material
){

  return new THREE.Mesh(
    new THREE.BoxGeometry(
      x,
      y,
      z
    ),
    material
  );

}


const parts = {};


/* BODY */

const torso =
  box(
    1.05,
    1.65,
    .58,
    jacketMat
  );

torso.position.y =
  2.25;

player.add(torso);

parts.torso = torso;


/* CHEST */

const chest =
  box(
    .5,
    1.05,
    .05,
    jacketEdgeMat
  );

chest.position.set(
  0,
  2.25,
  -.32
);

player.add(chest);


/* HEAD */

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .48,
      20,
      16
    ),
    skinMat
  );

head.scale.set(
  .9,
  1.08,
  .9
);

head.position.y =
  3.72;

player.add(head);


/* HAIR */

const hair =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .5,
      16,
      12
    ),
    hairMat
  );

hair.scale.set(
  1.02,
  .65,
  1.02
);

hair.position.y =
  4.02;

player.add(hair);


/* HAIR SPIKES */

for(
  let i=0;
  i<7;
  i++
){

  const spike =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        .13,
        .42,
        8
      ),
      hairMat
    );

  spike.position.set(
    -.39+i*.13,
    4.24+(i%2)*.06,
    0
  );

  spike.rotation.z =
    (i-3)*.18;

  player.add(spike);

}


/* EYES */

const eyeMat =
  new THREE.MeshBasicMaterial({
    color:0x00eaff
  });

for(
  const x of [-.17,.17]
){

  const eye =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .12,
        .035,
        .025
      ),
      eyeMat
    );

  eye.position.set(
    x,
    3.72,
    -.455
  );

  player.add(eye);

}


/* ARMS */

function makeArm(side){

  const upper =
    box(
      .28,
      .78,
      .28,
      jacketMat
    );

  upper.position.set(
    side*.68,
    2.55,
    0
  );

  player.add(upper);


  const lower =
    box(
      .25,
      .72,
      .25,
      skinMat
    );

  lower.position.set(
    side*.68,
    1.78,
    0
  );

  player.add(lower);


  return {
    upper,
    lower
  };

}


/* =========================================================
   PLAYER
   Human-shaped Shadow Runner
========================================================= */

const player =
  new THREE.Group();

scene.add(player);

player.position.set(
  0,
  0,
  6
);


/* =========================================================
   PLAYER MATERIALS
========================================================= */

const skinMat =
  new THREE.MeshStandardMaterial({
    color:0xb9785b,
    roughness:.7
  });

const hairMat =
  new THREE.MeshStandardMaterial({
    color:0x030308,
    roughness:.45
  });

const jacketMat =
  new THREE.MeshStandardMaterial({
    color:0x21103f,
    emissive:0x100020,
    emissiveIntensity:.7,
    roughness:.65
  });

const jacketEdgeMat =
  new THREE.MeshStandardMaterial({
    color:0x7c35e8,
    emissive:0x351080,
    emissiveIntensity:1,
    roughness:.4
  });

const pantsMat =
  new THREE.MeshStandardMaterial({
    color:0x090912,
    roughness:.8
  });

const shoeMat =
  new THREE.MeshStandardMaterial({
    color:0x030306,
    metalness:.25,
    roughness:.5
  });

const eyeMat =
  new THREE.MeshBasicMaterial({
    color:0x00eaff
  });

const auraMat =
  new THREE.MeshBasicMaterial({
    color:0x792cff,
    transparent:true,
    opacity:.22,
    side:THREE.DoubleSide
  });


/* =========================================================
   HELPER
========================================================= */

function roundedPart(
  radius,
  width,
  height,
  depth,
  material
){

  const mesh =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        radius,
        height,
        6,
        12
      ),
      material
    );

  mesh.scale.x =
    width / (radius*2);

  mesh.scale.z =
    depth / (radius*2);

  return mesh;

}


/* =========================================================
   PARTS
========================================================= */

const parts = {};


/* =========================================================
   TORSO
========================================================= */

const torso =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .55,
      1.05,
      6,
      14
    ),
    jacketMat
  );

torso.scale.set(
  1.05,
  1,
  .62
);

torso.position.y =
  2.25;

player.add(torso);

parts.torso =
  torso;


/* =========================================================
   JACKET FRONT
========================================================= */

const jacketFront =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .42,
      .95,
      .055
    ),
    jacketEdgeMat
  );

jacketFront.position.set(
  0,
  2.27,
  -.35
);

player.add(jacketFront);

parts.jacketFront =
  jacketFront;


/* =========================================================
   BELT
========================================================= */

const belt =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .95,
      .12,
      .58
    ),
    jacketEdgeMat
  );

belt.position.y =
  1.72;

player.add(belt);

parts.belt =
  belt;


/* =========================================================
   NECK
========================================================= */

const neck =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .16,
      .18,
      .25,
      12
    ),
    skinMat
  );

neck.position.y =
  3.15;

player.add(neck);


/* =========================================================
   HEAD
========================================================= */

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .47,
      20,
      16
    ),
    skinMat
  );

head.scale.set(
  .92,
  1.08,
  .9
);

head.position.y =
  3.65;

player.add(head);

parts.head =
  head;


/* =========================================================
   HAIR
========================================================= */

const hair =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .51,
      18,
      14
    ),
    hairMat
  );

hair.scale.set(
  1,
  .72,
  1
);

hair.position.y =
  3.93;

player.add(hair);

parts.hair =
  hair;


/* =========================================================
   HAIR SPIKES
========================================================= */

/* =========================================================
   PLAYER ANIMATION
========================================================= */

function animatePlayer(){

  if(!running)
    return;


  const swing =
    Math.sin(
      runTime * 13
    );

  const opposite =
    Math.sin(
      runTime * 13 +
      Math.PI
    );


  /* =====================================================
     SLIDE
  ===================================================== */

  if(isSliding){

    player.scale.y =
      .58;

    player.position.y =
      .03;


    parts.leftArm.group.rotation.x =
      1.05;

    parts.rightArm.group.rotation.x =
      1.05;


    parts.leftLeg.group.rotation.x =
      .25;

    parts.rightLeg.group.rotation.x =
      -.25;


    return;

  }


  /* =====================================================
     NORMAL HEIGHT
  ===================================================== */

  player.scale.y =
    1;


  /* =====================================================
     LEGS
  ===================================================== */

  parts.leftLeg.group.rotation.x =
    swing * .72;

  parts.rightLeg.group.rotation.x =
    opposite * .72;


  parts.leftLeg.lower.rotation.x =
    -Math.max(
      0,
      swing
    ) * .35;

  parts.rightLeg.lower.rotation.x =
    -Math.max(
      0,
      opposite
    ) * .35;


  /* =====================================================
     ARMS
  ===================================================== */

  parts.leftArm.group.rotation.x =
    opposite * .62;

  parts.rightArm.group.rotation.x =
    swing * .62;


  parts.leftArm.lower.rotation.x =
    opposite * .25;

  parts.rightArm.lower.rotation.x =
    swing * .25;


  /* =====================================================
     BODY BOB
  ===================================================== */

  if(!isJumping){

    player.position.y =
      Math.abs(
        Math.sin(
          runTime * 13
        )
      ) * .035;

  }


  /* =====================================================
     AURA
  ===================================================== */

  parts.aura.rotation.y +=
    .025;

}

    Math.floor(
      Math.random()*3
    );

    );

  }

}


/* =========================================================
   ZIGZAG COINS
========================================================= */

function spawnZigzagCoins(){

  let lane =
    Math.floor(
      Math.random()*3
    );


  for(
    let i=0;
    i<9;
    i++
  ){

    createCoin(
      lane,
      -110-i*3.2,
      1.25
    );


    if(i%2===1){

      if(lane===0)
        lane=1;

      else if(lane===2)
        lane=1;

      else
        lane =
          Math.random()<.5
          ? 0
          : 2;

    }

  }

}


/* =========================================================
   SPAWN PATTERN
========================================================= */

function spawnPattern(){

  const roll =
    Math.random();


  /* COINS */

  if(roll < .20){

    spawnCoinLine();

    return;

  }


  /* ZIGZAG COINS */

  if(roll < .31){

    spawnZigzagCoins();

    return;

  }


  /* TWO BARRIERS */

  if(roll < .49){

    const safe =
      Math.floor(
        Math.random()*3
      );


    for(
      let lane=0;
      lane<3;
      lane++
    ){

      if(lane !== safe){

        createBarrier(
          lane,
          -108
        );

      }

    }

    return;

  }


  /* SINGLE BARRIER */

  if(roll < .61){

    createBarrier(
      Math.floor(
        Math.random()*3
      ),
      -108
    );

    return;

  }


  /* TRAIN */

  if(roll < .73){

    createTrain(
      Math.floor(
        Math.random()*3
      ),
      -112
    );

    return;

  }


  /* OVERHEAD */

  if(roll < .84){

    createOverhead(
      Math.floor(
        Math.random()*3
      ),
      -108
    );

    return;

  }


  /* POWER */

  createPower(
    Math.floor(
      Math.random()*3
    ),
    -110
  );

}


/* =========================================================
   COLLISION
========================================================= */

function sameLane(o){

  return Math.abs(
    o.mesh.position.x -
    player.position.x
  ) < 1.2;

}


function handleCollision(o){

  if(o.hit)
    return;

  if(!sameLane(o))
    return;


  const dz =
    Math.abs(
      o.mesh.position.z -
      player.position.z
    );


  if(dz > 2.25)
    return;


  /* COIN */

  if(o.type === "coin"){

    o.hit = true;

    runCoins++;


    const value =
      powerMode === "coins"
      ? 100
      : 50;


    score +=
      value*multiplier;


    removeObject(o);

    return;

  }


  /* POWER */

  if(o.type === "power"){

    o.hit = true;

    powerCount++;

    activatePower(
      o.powerType
    );

    removeObject(o);

    return;

  }


  /* BARRIER */

  if(o.type === "barrier"){

    if(
      isJumping ||
      powerMode === "shield"
    ){

      if(powerMode === "shield"){

        showPower(
          "🛡 SHIELD BLOCKED!"
        );

      }

      else{

        score +=
          100*multiplier;

      }

      o.hit = true;

      removeObject(o);

      return;

    }


    endGame();

    return;

  }


  /* TRAIN */

  if(o.type === "train"){

    if(
      isJumping ||
      powerMode === "shield"
    ){

      if(powerMode === "shield"){

        showPower(
          "🛡 TRAIN BLOCKED!"
        );

      }

      o.hit = true;

      removeObject(o);

      return;

    }


    endGame();

    return;

  }


  /* OVERHEAD */

  if(o.type === "overhead"){

    if(
      isSliding ||
      powerMode === "shield"
    ){

      if(powerMode === "shield"){

        showPower(
          "🛡 OBSTACLE BLOCKED!"
        );

      }

      o.hit = true;

      removeObject(o);

      return;

    }


    endGame();

  }

}


/* =========================================================
   REMOVE OBJECT
========================================================= */

function removeObject(o){

  if(!o)
    return;


  scene.remove(
    o.mesh
  );


  const index =
    objects.indexOf(o);


  if(index !== -1){

    objects.splice(
      index,
      1
    );

  }

}


/* =========================================================
   CLEAR OBJECTS
========================================================= */

function clearObjects(){

  while(objects.length){

    const o =
      objects.pop();

    scene.remove(
      o.mesh
    );

  }

}

function activatePower(type){

  powerMode =
    type;


  powerRemaining =
    type === "speed"
    ? 5
    : 8;


  if(type === "speed"){

    showPower(
      "⚡ SHADOW SPEED!"

  }

  const element =
    document.getElementById(
      "power"
    );


  element.textContent =

/* =========================================================
   TOUCH CONTROLS
========================================================= */

let touchStartX = 0;
let touchStartY = 0;

renderer.domElement.addEventListener(
  "touchstart",
  function(e){

    if(!running)
      return;


    const touch =
      e.changedTouches[0];


    touchStartX =
      touch.clientX;

    touchStartY =
      touch.clientY;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchend",
  function(e){

    if(!running)
      return;


    const touch =
      e.changedTouches[0];


    const dx =
      touch.clientX -
      touchStartX;

    const dy =
      touch.clientY -
      touchStartY;


    const threshold =
      30;


    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      ) < threshold
    ){

      return;

    }


    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      if(dx > 0)
        moveRight();

      else
        moveLeft();

    }

    else{

      if(dy < 0)
        jump();

      else
        slide();

    }

  },
  {passive:true}
);

function updatePlayer(dt){

  /* ================================
     LANE MOVEMENT
  ================================= */

  const targetX =
    laneX(targetLane);

  player.position.x +=
    (
      targetX -
      player.position.x
    ) *
    Math.min(
      1,
      dt * 13
    );


  /* ================================
     JUMP
  ================================= */

  if(isJumping){

    player.position.y +=
      jumpVelocity * dt;

    jumpVelocity -=
      28 * dt;


    if(
      player.position.y <= 0
    ){

      player.position.y =
        0;

      jumpVelocity =
        0;

      isJumping =
        false;

    }

  }


  /* ================================
     SLIDE
  ================================= */

  if(isSliding){

    slideTimer -=
      dt;

    player.scale.y =
      .58;

    player.position.y =
      .03;


    if(
      slideTimer <= 0
    ){

      isSliding =
        false;

      player.scale.y =
        1;

      player.position.y =
        0;

    }

  }


  /* ================================
     NORMAL GROUND POSITION
  ================================= */

  if(
    !isJumping &&
    !isSliding
  ){

    /*
      Keep the character standing
      on the road instead of floating.
    */

    player.position.y =
      Math.max(
        0,
        player.position.y
      );

  }


  /* ================================
     PLAYER SHADOW
  ================================= */

  updatePlayerShadow();

}

/* =========================================================
   UPDATE OBJECTS
========================================================= */

function updateObjects(dt){

  const boost =
    powerMode === "speed"
    ? 1.35
    : 1;


  const movement =
    speed*
    dt*
    boost;


  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const o =
      objects[i];


    o.mesh.position.z +=
      movement;


    /* COIN ROTATION */

    if(o.type === "coin"){

      o.mesh.rotation.y +=
        dt*5;

      o.mesh.rotation.z +=
        dt*2;

    }


    /* POWER ROTATION */

    if(o.type === "power"){

      o.mesh.rotation.y +=
        dt*3;

      o.mesh.rotation.x +=
        dt*2;

    }


    handleCollision(o);


    if(
      objects[i] !== o
    ){

      continue;

    }


    if(
      o.mesh.position.z > 18
    ){

      removeObject(o);

    }

  }

}


/* =========================================================
   ENDLESS WORLD
========================================================= */

function updateEnvironment(dt){

  const boost =
    powerMode === "speed"
    ? 1.35
    : 1;


  const movement =
    speed*
    dt*
    boost;


  /* ROAD */

  for(
    const segment of roadSegments
  ){

    segment.position.z +=
      movement;


    if(
      segment.position.z > 40
    ){

      segment.position.z -=
        ROAD_SEGMENTS *
        ROAD_SEGMENT_LENGTH;

    }

  }


  /* LANE LINES */

  for(
    const line of laneLines
  ){

    line.position.z +=
      movement;


    if(
      line.position.z > 40
    ){

      line.position.z -=
        ROAD_SEGMENTS *
        ROAD_SEGMENT_LENGTH;

    }

  }


  /* RAILS */

  for(
    const rail of rails
  ){

    rail.position.z +=
      movement;


    if(
      rail.position.z > 40
    ){

      rail.position.z -=
        ROAD_SEGMENTS *
        ROAD_SEGMENT_LENGTH;

    }

  }


  /* BUILDINGS */

  for(
    const building of buildings
  ){

    building.position.z +=
      movement;


    if(
      building.position.z > 40
    ){

      building.position.z -=
        480;

    }

  }


  /* LAMPS */

  for(
    const lamp of lamps
  ){

    lamp.position.z +=
      movement;


    if(
      lamp.position.z > 40
    ){

      lamp.position.z -=
        510;

    }

  }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

  const targetX =
    player.position.x*.42;


  camera.position.x +=
    (
      targetX -
      camera.position.x
    ) *
    Math.min(
      1,
      dt*5
    );


  const targetY =
    isJumping
    ? 5.8
    : 5.3;


  camera.position.y +=
    (
      targetY -
      camera.position.y
    ) *
    Math.min(
      1,
      dt*4
    );


  camera.lookAt(
    player.position.x*.2,
    2.15,
    -10
  );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById(
    "score"
  ).textContent =
    Math.floor(
      score
    ).toLocaleString();


  document.getElementById(
    "multiplier"
  ).textContent =
    "x"+multiplier;


  document.getElementById(
    "coins"
  ).textContent =
    (
      save.coins+
      runCoins
    ).toLocaleString();

}


/* =========================================================
   GAME UPDATE
========================================================= */

function update(dt){

  distance +=
    speed*dt;


  /* SCORE */

  score +=
    speed*
    dt*
    .72*
    multiplier;


  /* MULTIPLIER */

  multiplier =
    Math.min(
      10,
      1+
      Math.floor(
        score/1000
      )
    );


  /* SPEED */

  speed +=
    dt*.38;


  /*
    Cap the speed so the game
    remains playable on mobile.
  */

  speed =
    Math.min(
      speed,
      42
    );


  /* POWER TIMER */

  if(powerMode){

    powerRemaining -=
      dt;


    if(
      powerRemaining <= 0
    ){

      powerMode =
        "";

    }

  }


  updatePlayer(dt);

  updateObjects(dt);

  updateEnvironment(dt);

  updateCamera(dt);


  /* OBSTACLE SPAWNING */

  spawnTimer -=
    dt;


  if(
    spawnTimer <= 0
  ){

    spawnPattern();


    const difficulty =
      Math.min(
        1,
        distance/5000
      );


    spawnTimer =
      Math.max(
        .48,
        .85 -
        difficulty*.25 +
        Math.random()*.3
      );

  }


  /* POWER SPAWNING */

  powerTimer -=
    dt;


  if(
    powerTimer <= 0
  ){

    if(
      Math.random() < .65
    ){

      createPower(
        Math.floor(
          Math.random()*3
        ),
        -120
      );

    }


    powerTimer =
      7+
      Math.random()*5;

  }


  runTime +=
    dt;


  animatePlayer();

  updateHUD();

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!running)
    return;


  running =
    false;


  const finalScore =
    Math.floor(score);


  save.coins +=
    runCoins;


  if(
    finalScore >
    save.best
  ){

    save.best =
      finalScore;

  }


  saveGame();


  document.getElementById(
    "finalScore"
  ).textContent =
    finalScore.toLocaleString();


  document.getElementById(
    "finalCoins"
  ).textContent =
    runCoins.toLocaleString();


  document.getElementById(
    "finalBest"
  ).textContent =
    save.best.toLocaleString();


  updateMissions();


  showScreen(
    "gameOver"
  );

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

  clearObjects();


  score = 0;

  runCoins = 0;

  multiplier = 1;


  speed = 18;


  targetLane = 1;


  player.position.set(
    0,
    0,
    6
  );


  player.rotation.set(
    0,
    0,
    0
  );


  player.scale.set(
    1,
    1,
    1
  );


  isJumping =
    false;

  isSliding =
    false;

  jumpVelocity =
    0;

  slideTimer =
    0;


  powerMode =
    "";

  powerRemaining =
    0;


  powerCount =
    0;


  distance =
    0;

  runTime =
    0;


  spawnTimer =
    .8;

  powerTimer =
    5;


  running =
    true;


  document.getElementById(
    "swipeHint"
  ).style.display =
    "block";


  showScreen(null);


  lastTime =
    performance.now();


  updateHUD();

}


/* =========================================================
   SCREENS
========================================================= */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(
      function(screen){

        screen.classList.add(
          "hidden"
        );

      }
    );


  if(id){

    document
      .getElementById(id)
      .classList.remove(
        "hidden"
      );

  }

}


/* =========================================================
   MENU
========================================================= */

function updateMenu(){

  document.getElementById(
    "menuCoins"
  ).textContent =
    save.coins.toLocaleString();


  document.getElementById(
    "menuBest"
  ).textContent =
    save.best.toLocaleString();

}


/* =========================================================
   MISSIONS
========================================================= */

function updateMissions(){

  const coins =
    Math.min(
      runCoins,
      25
    );


  const missionScore =
    Math.min(
      Math.floor(score),
      2000
    );


  const powers =
    Math.min(
      powerCount,
      3
    );


  document.getElementById(
    "missionCoins"
  ).textContent =
    coins+" / 25";


  document.getElementById(
    "missionScore"
  ).textContent =
    missionScore+" / 2000";


  document.getElementById(
    "missionPower"
  ).textContent =
    powers+" / 3";


  document.getElementById(
    "missionBoxCoins"
  ).classList.toggle(
    "complete",
    coins >= 25
  );


  document.getElementById(
    "missionBoxScore"
  ).classList.toggle(
    "complete",
    missionScore >= 2000
  );


  document.getElementById(
    "missionBoxPower"
  ).classList.toggle(
    "complete",
    powers >= 3
  );

}


/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("retryBtn")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("homeBtn")
  .addEventListener(
    "click",
    function(){

      updateMenu();

      showScreen(
        "menu"
      );

    }
  );


document
  .getElementById("missionsBtn")
  .addEventListener(
    "click",
    function(){

      updateMissions();

      showScreen(
        "missionsScreen"
      );

    }
  );


document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    function(){

      updateMenu();

      showScreen(
        "menu"
      );

    }
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    function(){

      if(
        !confirm(
          "Reset Shadow Rush save?"
        )
      ){

        return;

      }


      localStorage.removeItem(
        SAVE_KEY
      );


      save = {
        coins:0,
        best:0
      };


      updateMenu();

    }
  );


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        1.6
      )
     );
  }
);


/* =========================================================
   GAME LOOP
========================================================= */

function loop(time){

  requestAnimationFrame(
    loop
  );


  if(!lastTime){

    lastTime =
      time;

  }


  const dt =
    Math.min(
      .05,
      (time-lastTime)/1000
    );


  lastTime =
    time;


  if(running){

    update(dt);

  }


  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   INITIALIZATION
========================================================= */

updateMenu();


setTimeout(
  function(){

    document.getElementById(
      "loadingText"
    ).textContent =
      "Shadow World Ready...";

  },
  700
);


setTimeout(
  function(){

    showScreen(
      "menu"
    );

  },
  1300
);


lastTime =
  performance.now();


requestAnimationFrame(
  loop
);

</script>
