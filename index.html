<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Shadow Rush</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:94%;
  max-width:500px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  pointer-events:none;
}

.stat{
  background:rgba(0,0,0,.65);
  border:2px solid #00eaff;
  border-radius:10px;
  padding:8px 12px;
  color:#fff;
  font-weight:bold;
  text-shadow:0 0 8px #00eaff;
}

#menu,
#gameOver{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#11174d,#03040b 70%);
}

.panel{
  width:90%;
  max-width:400px;
  padding:28px;
  text-align:center;
  border:2px solid #00eaff;
  border-radius:20px;
  background:rgba(3,5,18,.94);
  box-shadow:0 0 35px #005eff;
  color:white;
}

h1{
  color:#00eaff;
  font-size:34px;
  text-shadow:0 0 18px #00aaff;
  margin-bottom:12px;
}

h2{
  color:#ff416c;
}

button{
  padding:13px 22px;
  margin:7px;
  border:2px solid #00cfff;
  border-radius:11px;
  background:#070b20;
  color:#00eaff;
  font-size:16px;
  font-weight:bold;
}

.hidden{
  display:none!important;
}

.info{
  margin:14px 0;
  line-height:1.7;
}

.small{
  color:#aaa;
  font-size:13px;
  margin-top:15px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

  <div class="stat">
    🪙 <span id="coins">0</span>
  </div>

  <div class="stat">
    🏆 <span id="score">0</span>
  </div>

  <div class="stat">
    ⚡ <span id="speed">1.0</span>
  </div>

</div>


<div id="menu">

  <div class="panel">

    <h1>🌑 SHADOW RUSH</h1>

    <p>
      THE ENDLESS RUN BEGINS
    </p>

    <div class="info">

      🏃 Run automatically<br>
      👈 Swipe left<br>
      👉 Swipe right<br>
      👆 Swipe up to jump<br>
      👇 Swipe down to slide

    </div>

    <p>
      Total Coins:
      <strong id="menuCoins">0</strong>
    </p>

    <p>
      Best Score:
      <strong id="best">0</strong>
    </p>

    <button onclick="startGame()">
      ▶ START RUN
    </button>

    <p class="small">
      No buttons are needed during gameplay.
    </p>

  </div>

</div>


<div id="gameOver" class="hidden">

  <div class="panel">

    <h2>RUN OVER</h2>

    <br>

    <p>
      Score:
      <strong id="finalScore">0</strong>
    </p>

    <p>
      Coins:
      <strong id="finalCoins">0</strong>
    </p>

    <p>
      Best:
      <strong id="finalBest">0</strong>
    </p>

    <br>

    <button onclick="startGame()">
      🔄 RUN AGAIN
    </button>

    <button onclick="showMenu()">
      🏠 MENU
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =====================================================
   SAVE
===================================================== */

const SAVE_KEY =
  "shadowRush3D";

let save = {
  coins:0,
  best:0
};

try{

  const old =
    localStorage.getItem(SAVE_KEY);

  if(old){
    save = {
      ...save,
      ...JSON.parse(old)
    };
  }

}catch(e){}

function saveGame(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(save)
  );

}


/* =====================================================
   THREE.JS
===================================================== */

const container =
  document.getElementById("game");

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x030617);

scene.fog =
  new THREE.Fog(
    0x030617,
    35,
    180
  );


const camera =
  new THREE.PerspectiveCamera(
    65,
    window.innerWidth /
    window.innerHeight,
    .1,
    500
  );

camera.position.set(
  0,
  4.5,
  8
);


const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

container.appendChild(
  renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const ambient =
  new THREE.HemisphereLight(
    0x88aaff,
    0x080810,
    1.5
  );

scene.add(ambient);


const moonLight =
  new THREE.DirectionalLight(
    0x99bbff,
    1.4
  );

moonLight.position.set(
  -20,
  30,
  20
);

scene.add(moonLight);


/* =====================================================
   WORLD
===================================================== */

const roadLength = 220;

const road =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      12,
      .2,
      roadLength
    ),
    new THREE.MeshStandardMaterial({
      color:0x111522
    })
  );

road.position.set(
  0,
  0,
  -70
);

scene.add(road);


/* Lane lines */

const laneMaterial =
  new THREE.MeshBasicMaterial({
    color:0x00bfff
  });

for(let lane=-1;lane<=1;lane+=2){

  const line =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .08,
        .03,
        roadLength
      ),
      laneMaterial
    );

  line.position.set(
    lane*2,
    .13,
    -70
  );

  scene.add(line);

}


/* =====================================================
   SIDE BUILDINGS
===================================================== */

const buildings = [];

function createBuildings(){

  for(let i=0;i<35;i++){

    const height =
      4 + Math.random()*12;

    const width =
      3 + Math.random()*5;

    const depth =
      4 + Math.random()*8;

    const material =
      new THREE.MeshStandardMaterial({
        color:
          Math.random() > .5
            ? 0x101633
            : 0x171126
      });

    const building =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          width,
          height,
          depth
        ),
        material
      );

    const side =
      i%2===0
        ? -1
        : 1;

    building.position.set(
      side*(9+Math.random()*8),
      height/2,
      -i*7-10
    );

    scene.add(building);

    buildings.push(building);

  }

}

createBuildings();


/* =====================================================
   PLAYER
===================================================== */

const player =
  new THREE.Group();

scene.add(player);

player.position.set(
  0,
  1.1,
  4
);


/* Body */

const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .75,
      1.15,
      .45
    ),
    new THREE.MeshStandardMaterial({
      color:0x00aaff
    })
  );

body.position.y =
  0;

player.add(body);


/* Head */

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .32,
      16,
      16
    ),
    new THREE.MeshStandardMaterial({
      color:0xd9ad91
    })
  );

head.position.y =
  .85;

player.add(head);


/* Hair */

const hair =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .34,
      16,
      16,
      0,
      Math.PI*2,
      0,
      Math.PI/2
    ),
    new THREE.MeshStandardMaterial({
      color:0x080808
    })
  );

hair.position.y =
  1.02;

player.add(hair);


/* Legs */

const legMaterial =
  new THREE.MeshStandardMaterial({
    color:0x171c30
  });

const leftLeg =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .22,
      .75,
      .25
    ),
    legMaterial
  );

leftLeg.position.set(
  -.22,
  -.9,
  0
);

player.add(leftLeg);


const rightLeg =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .22,
      .75,
      .25
    ),
    legMaterial
  );

rightLeg.position.set(
  .22,
  -.9,
  0
);

player.add(rightLeg);


/* Arms */

const armMaterial =
  new THREE.MeshStandardMaterial({
    color:0x00aaff
  });

const leftArm =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .18,
      .75,
      .2
    ),
    armMaterial
  );

leftArm.position.set(
  -.52,
  -.05,
  0
);

player.add(leftArm);


const rightArm =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .18,
      .75,
      .2
    ),
    armMaterial
  );

rightArm.position.set(
  .52,
  -.05,
  0
);

player.add(rightArm);


/* =====================================================
   PLAYER STATE
===================================================== */

let lane = 0;
let targetX = 0;

let verticalVelocity = 0;
let grounded = true;

let sliding = false;
let slideTimer = 0;

const laneWidth = 2;


/* =====================================================
   GAME STATE
===================================================== */

let running = false;

let score = 0;

let runCoins = 0;

let gameSpeed = .42;

let objects = [];

let coinObjects = [];

let spawnTimer = 0;

let coinTimer = 0;

let lastTime = 0;


/* =====================================================
   OBSTACLE
===================================================== */

function createObstacle(){

  const laneNumber =
    Math.floor(
      Math.random()*3
    ) - 1;

  const obstacle =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.3,
        1.2,
        1.3
      ),
      new THREE.MeshStandardMaterial({
        color:0xff3155
      })
    );

  obstacle.position.set(
    laneNumber*laneWidth,
    .6,
    -100
  );

  scene.add(obstacle);

  objects.push(
    obstacle
  );

}


/* =====================================================
   COINS
===================================================== */

function createCoins(){

  const laneNumber =
    Math.floor(
      Math.random()*3
    ) - 1;

  for(let i=0;i<6;i++){

    const coin =
      new THREE.Mesh(
        new THREE.TorusGeometry(
          .25,
          .08,
          8,
          16
        ),
        new THREE.MeshStandardMaterial({
          color:0xffd700,
          emissive:0x664400
        })
      );

    coin.rotation.x =
      Math.PI/2;

    coin.position.set(
      laneNumber*laneWidth,
      1.4,
      -80-i*3
    );

    scene.add(coin);

    coinObjects.push(
      coin
    );

  }

}


/* =====================================================
   START
===================================================== */

function startGame(){

  document
    .getElementById("menu")
    .classList.add("hidden");

  document
    .getElementById("gameOver")
    .classList.add("hidden");

  objects.forEach(
    o=>scene.remove(o)
  );

  coinObjects.forEach(
    c=>scene.remove(c)
  );

  objects=[];
  coinObjects=[];

  lane=0;
  targetX=0;

  player.position.set(
    0,
    1.1,
    4
  );

  verticalVelocity=0;
  grounded=true;

  sliding=false;

  score=0;
  runCoins=0;

  gameSpeed=.42;

  spawnTimer=0;
  coinTimer=0;

  running=true;

  lastTime=
    performance.now();

  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   MOVEMENT
===================================================== */

function moveLeft(){

  if(!running) return;

  lane--;

  if(lane < -1)
    lane=-1;

  targetX =
    lane*laneWidth;

}


function moveRight(){

  if(!running) return;

  lane++;

  if(lane > 1)
    lane=1;

  targetX =
    lane*laneWidth;

}


function jump(){

  if(
    !running ||
    !grounded ||
    sliding
  )
    return;

  grounded=false;

  verticalVelocity=.27;

}


function slide(){

  if(
    !running ||
    !grounded
  )
    return;

  sliding=true;

  slideTimer=500;

}


/* =====================================================
   SWIPE CONTROLS
===================================================== */

let startX=0;
let startY=0;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{

    const t=e.touches[0];

    startX=t.clientX;
    startY=t.clientY;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchend",
  e=>{

    if(!running)
      return;

    const t=e.changedTouches[0];

    const dx =
      t.clientX-startX;

    const dy =
      t.clientY-startY;

    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      if(
        Math.abs(dx)>30
      ){

        if(dx>0)
          moveRight();
        else
          moveLeft();

      }

    }else{

      if(
        Math.abs(dy)>30
      ){

        if(dy<0)
          jump();
        else
          slide();

      }

    }

  },
  {passive:true}
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      moveLeft();

    if(e.key==="ArrowRight")
      moveRight();

    if(e.key==="ArrowUp")
      jump();

    if(e.key==="ArrowDown")
      slide();

  }
);


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

  return (
    Math.abs(
      a.position.x -
      b.position.x
    ) < 1 &&

    Math.abs(
      a.position.z -
      b.position.z
    ) < 1.2 &&

    Math.abs(
      a.position.y -
      b.position.y
    ) < 1.5
  );

}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  /*
    Smooth lane movement.
  */

  player.position.x +=
    (
      targetX -
      player.position.x
    ) * .18;


  /*
    Jump.
  */

  if(!grounded){

    player.position.y +=
      verticalVelocity *
      dt;

    verticalVelocity -=
      .014 *
      dt;

    if(
      player.position.y <=
      1.1
    ){

      player.position.y=1.1;

      verticalVelocity=0;

      grounded=true;

    }

  }


  /*
    Slide.
  */

  if(sliding){

    slideTimer -= dt*16;

    player.scale.y=.55;

    if(slideTimer<=0){

      sliding=false;

      player.scale.y=1;

    }

  }


  /*
    Running animation.
  */

  const run =
    performance.now()/100;

  leftLeg.rotation.x =
    Math.sin(run)*.6;

  rightLeg.rotation.x =
    -Math.sin(run)*.6;

  leftArm.rotation.x =
    -Math.sin(run)*.5;

  rightArm.rotation.x =
    Math.sin(run)*.5;


  /*
    Speed.
  */

  gameSpeed +=
    .000025 *
    dt;

  if(gameSpeed>.9)
    gameSpeed=.9;


  /*
    Objects move.
  */

  objects.forEach(
    object=>{

      object.position.z +=
        gameSpeed*dt;

    }
  );


  coinObjects.forEach(
    coin=>{

      coin.position.z +=
        gameSpeed*dt;

      coin.rotation.z +=
        .08*dt;

    }
  );


  /*
    Spawn.
  */

  spawnTimer += dt;

  coinTimer += dt;

  if(
    spawnTimer >
    55
  ){

    createObstacle();

    spawnTimer=0;

  }

  if(
    coinTimer >
    75
  ){

    createCoins();

    coinTimer=0;

  }


  /*
    Collision.
  */

  for(
    const obstacle of objects
  ){

    if(
      collision(
        player,
        obstacle
      )
    ){

      endGame();

      return;

    }

  }


  /*
    Coins.
  */

  for(
    const coin of coinObjects
  ){

    if(
      !coin.userData.collected &&
      Math.abs(
        player.position.x -
        coin.position.x
      )<1 &&

      Math.abs(
        player.position.z -
        coin.position.z
      )<1.4 &&

      Math.abs(
        player.position.y -
        coin.position.y
      )<1.5
    ){

      coin.userData.collected=true;

      coin.visible=false;

      runCoins++;

      save.coins++;

      saveGame();

    }

  }


  /*
    Cleanup.
  */

  objects =
    objects.filter(
      object=>{

        if(
          object.position.z>15
        ){

          scene.remove(object);

          return false;

        }

        return true;

      }
    );


  coinObjects =
    coinObjects.filter(
      coin=>{

        if(
          coin.position.z>15
        ){

          scene.remove(coin);

          return false;

        }

        return true;

      }
    );


  score +=
    gameSpeed*dt*.8;


  updateHUD();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById(
    "coins"
  ).textContent =
    runCoins;

  document.getElementById(
    "score"
  ).textContent =
    Math.floor(score);

  document.getElementById(
    "speed"
  ).textContent =
    (
      gameSpeed/.42
    ).toFixed(1);

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

  if(!running)
    return;

  const dt =
    Math.min(
      time-lastTime,
      40
    );

  lastTime=time;

  update(dt);

  camera.lookAt(
    player.position.x*.35,
    1.5,
    -12
  );

  renderer.render(
    scene,
    camera
  );

  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

  running=false;

  const finalScore =
    Math.floor(score);

  if(
    finalScore >
    save.best
  ){

    save.best =
      finalScore;

  }

  saveGame();

  document.getElementById(
    "finalScore"
  ).textContent =
    finalScore;

  document.getElementById(
    "finalCoins"
  ).textContent =
    runCoins;

  document.getElementById(
    "finalBest"
  ).textContent =
    save.best;

  document
    .getElementById("gameOver")
    .classList.remove("hidden");

}


/* =====================================================
   MENU
===================================================== */

function showMenu(){

  running=false;

  document
    .getElementById("gameOver")
    .classList.add("hidden");

  document
    .getElementById("menu")
    .classList.remove("hidden");

  document.getElementById(
    "menuCoins"
  ).textContent =
    save.coins;

  document.getElementById(
    "best"
  ).textContent =
    save.best;

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* Initial menu */

document.getElementById(
  "menuCoins"
).textContent =
  save.coins;

document.getElementById(
  "best"
).textContent =
  save.best;

</script>

</body>
        </html>
